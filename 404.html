<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="The requested page could not be found or requires different access permissions." data-i18n-placeholder="notfound.metaDescription">
  <title data-i18n="notfound.title">Page Not Found · COSYlanguages</title>

  <script>
    (function() {
      const firstPart = location.pathname.split('/')[1] || '';
      const basePath = (firstPart && !firstPart.includes('.')) ? '/' + firstPart + '/' : '/';
      window.COSY_BASE_PATH = basePath;

      const head = document.head;

      const fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/svg+xml';
      fav.href = basePath + 'shared/img/favicon.svg';
      head.appendChild(fav);

      const css1 = document.createElement('link');
      css1.rel = 'stylesheet';
      css1.href = basePath + 'shared/css/tokens.css';
      head.appendChild(css1);

      const css2 = document.createElement('link');
      css2.rel = 'stylesheet';
      css2.href = basePath + 'shared/styles/style.css';
      head.appendChild(css2);

      const jsSb = document.createElement('script');
      jsSb.async = false;
      jsSb.src = basePath + 'vendor/supabase-js-2.49.1/supabase.js';
      head.appendChild(jsSb);

      const js1 = document.createElement('script');
      js1.async = false;
      js1.src = basePath + 'shared/js/config.js';
      head.appendChild(js1);

      const js2 = document.createElement('script');
      js2.async = false;
      js2.src = basePath + 'shared/js/auth-guard.js';
      head.appendChild(js2);

      const jsSso = document.createElement('script');
      jsSso.async = false;
      jsSso.src = basePath + 'shared/js/auth-sso.js';
      head.appendChild(jsSso);

      const jsCms = document.createElement('script');
      jsCms.async = false;
      jsCms.src = basePath + 'shared/js/cms-editor.js';
      head.appendChild(jsCms);

      const js3 = document.createElement('script');
      js3.async = false;
      js3.src = basePath + 'shared/js/i18n.js';
      head.appendChild(js3);

      window.mountCosyLangSwitcher = function() {
        if (window.CosyLangSwitcher) {
          const container = document.getElementById('lang-switcher-container');
          if (container && !container.querySelector('.cosy-lang-switcher-select')) {
            window.CosyLangSwitcher.mount(container);
          }
        }
      };

      const js4 = document.createElement('script');
      js4.async = false;
      js4.onload = () => { if (window.mountCosyLangSwitcher) window.mountCosyLangSwitcher(); };
      js4.src = basePath + 'shared/js/lang-switcher.js';
      head.appendChild(js4);
    })();
  </script>
  <link rel="stylesheet" href="https://cosylanguages.github.io/COSYlanguages/css/ecosystem-strip.css">
  <link rel="stylesheet" href="shared/css/editorial.css?v=20261125-2">
</head>
<body class="not-found-page" style="background-color: var(--cosy-color-cream, #fdfcf8); min-height: 100vh; margin: 0; box-sizing: border-box; font-family: var(--cosy-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);">
<div data-ecosystem-strip data-self="platform" data-theme-toggle></div>

  <div class="not-found-card" style="background: var(--cosy-paper-card); border: 1px solid var(--cosy-paper-rule); border-radius: 22px; padding: clamp(28px, 5vw, 52px); max-width: 560px; width: 100%; text-align: center; box-shadow: var(--cosy-shadow-lift); position: relative;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;" id="lang-switcher-container"></div>
    <div class="not-found-code" aria-hidden="true">404</div>
    <h1 style="font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 560; color: var(--cosy-color-ink); margin: 0 0 12px 0;" data-i18n="notfound.heading">Page not found</h1>
    <p style="color: var(--cosy-color-ink-muted); font-size: 1rem; line-height: 1.6; margin: 0 auto 28px; max-width: 36ch;" data-i18n="notfound.message">That page doesn't exist or you may not have access to it.</p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a id="btn-signin" href="#" class="btn btn-outline" style="padding: 10px 20px; text-decoration: none; font-size: 0.9rem; font-weight: 700;" data-i18n="notfound.signIn">Sign in</a>
      <button id="btn-workspace" class="btn" style="background: var(--cosy-platform-accent); color: var(--on-primary, #ffffff); border: none; padding: 10px 20px; border-radius: 999px; font-size: 0.9rem; font-weight: 700; cursor: pointer;" data-i18n="notfound.backToWorkspace">Back to your workspace</button>
    </div>
  </div>

  <script>
    if (window.mountCosyLangSwitcher) window.mountCosyLangSwitcher();
    document.addEventListener('DOMContentLoaded', () => {
      const basePath = window.COSY_BASE_PATH || '/';
      const signInBtn = document.getElementById('btn-signin');
      const workspaceBtn = document.getElementById('btn-workspace');
      const loginUrl = basePath + 'login.html?redirect=' +
        encodeURIComponent(window.location.href) + '&v=20261125-2';

      if (window.mountCosyLangSwitcher) window.mountCosyLangSwitcher();

      if (signInBtn) {
        signInBtn.href = loginUrl;
      }

      if (workspaceBtn) {
        workspaceBtn.addEventListener('click', async () => {
          let targetPage = loginUrl;
          if (window.CosyAuth && typeof window.CosyAuth.getAuthAndProfile === 'function') {
            try {
              const authData = await window.CosyAuth.getAuthAndProfile();
              if (authData && authData.profile && authData.profile.role) {
                const role = authData.profile.role.toLowerCase();
                if (role === 'founder') targetPage = 'founder.html';
                else if (role === 'teacher') targetPage = 'teacher.html';
                else targetPage = 'student.html';
              }
            } catch (e) {}
          }
          window.location.href = /^(?:https?:)?\//.test(targetPage) ? targetPage : basePath + targetPage;
        });
      }
    });
  </script>
  <script src="https://cosylanguages.github.io/COSYlanguages/js/ecosystem-strip.js" defer></script>
</body>
</html>
