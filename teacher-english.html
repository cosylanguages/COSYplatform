<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYlanguages — English Teacher Hub</title>
  <link rel="stylesheet" href="shared/styles/style.css">
  <style>
    :root {
      --teacher-primary: #4f46e5;
    }
    body { background-color: #f8fafc; }
    .badge-teacher { background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
    .catalog-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .course-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .access-denied { max-width: 500px; margin: 80px auto; background: white; padding: 40px; border-radius: 12px; border: 1px solid #cbd5e1; text-align: center; }
  </style>
  <script src="shared/js/access-grants.js"></script>
</head>
<body>
  <div style="background: #fffbe3; border-bottom: 1px solid #f59e0b; color: #78350f; text-align: center; padding: 10px 16px; font-size: 0.85rem; font-weight: 600;">
    ℹ️ Notice: COSYlanguages entry points have consolidated into <a id="notice-hub-link" href="hub.html" style="color: #0284c7; text-decoration: underline;">hub.html</a>. Please update your bookmarks.
  </div>
  <header class="manual-header">
    <div class="header-content">
      <div class="logo-badge">
        <span>COSYlanguages</span>
        <span class="badge-teacher">🇬🇧 English Teacher Hub</span>
      </div>
      <div id="user-info" style="font-size: 0.85rem; color: #64748b;"></div>
    </div>
  </header>

  <main id="app-root" class="container">
    <!-- JS Rendered -->
  </main>

  <footer class="main-footer">
    <p>COSYlanguages English Department &copy; 2025.</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key');

    async function initEnglishHub() {
      const appRoot = document.getElementById('app-root');

      if (!key) {
        renderAccessDenied("Missing Key", "Access key required for English Teacher Hub.");
        return;
      }

      const noticeLink = document.getElementById('notice-hub-link');
      if (noticeLink && key) {
        noticeLink.href = `hub.html?key=${encodeURIComponent(key)}`;
      }

      try {
        const grantsRes = await fetch('data/access-grants.json');
        if (!grantsRes.ok) throw new Error("Unable to load access grants");
        const grantsData = await grantsRes.json();

        const grant = await window.CosyAccessGrants.matchGrant(grantsData.grants, key);
        if (!grant) {
          renderAccessDenied("Invalid Key", "Access key required for English Teacher Hub.");
          return;
        }

        const fullManifest = window.CosyAccessGrants ? window.CosyAccessGrants.FULL_MANIFEST : [];
        const allowedCourses = window.CosyAccessGrants ? window.CosyAccessGrants.resolveGrantCourses(grant, fullManifest) : [];

        document.getElementById('user-info').innerText = `Teacher: ${grant.name || 'English Teacher'}`;

        const englishCourses = fullManifest.filter(c => c.lang === 'en' && (allowedCourses.includes('*') || allowedCourses.includes(c.id)));

        let html = `
          <div class="catalog-container">
            <div style="margin-bottom: 24px;">
              <h1 style="font-size: 1.6rem; color: #0f172a;">🇬🇧 English Teacher Catalog &amp; Resources</h1>
              <p style="color: #64748b;">Complete English courses: General, Spoken, Grammar, Phrasal Verbs, Vocabulary, and Pronunciation.</p>
            </div>
            <div class="catalog-grid">
        `;

        if (englishCourses.length === 0) {
          html += `<p style="grid-column: 1/-1; color: #64748b;">No English courses found for this grant filter.</p>`;
        } else {
          englishCourses.forEach(course => {
            html += `
              <div class="course-card">
                <div>
                  <span class="badge-teacher" style="margin-bottom: 8px; display: inline-block;">${course.level.toUpperCase()}</span>
                  <h3 style="font-size: 1.15rem; color: #0f172a; margin-bottom: 6px;">${course.title}</h3>
                  <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">Track: ${course.track}</p>
                </div>
                <a href="teacher.html?key=${key}&course=${course.id}&level=${course.level.toLowerCase()}" class="btn" style="background: var(--teacher-primary); text-align: center;">Open Teacher Roadmap</a>
              </div>
            `;
          });
        }

        html += `</div></div>`;
        appRoot.innerHTML = html;

      } catch (err) {
        renderAccessDenied("Error", err.message);
      }
    }

    function renderAccessDenied(title, message) {
      document.getElementById('app-root').innerHTML = `<div class="access-denied"><h2>🔒 ${title}</h2><p>${message}</p></div>`;
    }

    window.onload = initEnglishHub;
  </script>
</body>
</html>
