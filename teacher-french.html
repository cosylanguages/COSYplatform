<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYlanguages — French Teacher Hub</title>
  <link rel="stylesheet" href="shared/styles/style.css">
  <style>
    :root {
      --teacher-primary: #0284c7;
    }
    body { background-color: #f8fafc; }
    .badge-teacher { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
    .catalog-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .course-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .access-denied { max-width: 500px; margin: 80px auto; background: white; padding: 40px; border-radius: 12px; border: 1px solid #cbd5e1; text-align: center; }
  </style>
</head>
<body>
  <header class="manual-header">
    <div class="header-content">
      <div class="logo-badge">
        <span>COSYlanguages</span>
        <span class="badge-teacher">🇫🇷 French Teacher Hub</span>
      </div>
      <div id="user-info" style="font-size: 0.85rem; color: #64748b;"></div>
    </div>
  </header>

  <main id="app-root" class="container">
    <!-- JS Rendered -->
  </main>

  <footer class="main-footer">
    <p>COSYlanguages French Department &copy; 2025.</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key') || 'teacher-french-key';

    async function initFrenchHub() {
      const appRoot = document.getElementById('app-root');

      try {
        const grantsRes = await fetch('data/access-grants.json');
        if (!grantsRes.ok) throw new Error("Unable to load access grants");
        const grantsData = await grantsRes.json();

        const grant = grantsData.grants.find(g => g.key === key);
        if (!grant) {
          renderAccessDenied("Invalid Key", "Access key required for French Teacher Hub.");
          return;
        }

        document.getElementById('user-info').innerText = `Enseignant: ${grant.name || 'Professeur de français'}`;

        const frenchCourses = [
          { id: "fr-pron-a1", title: "Prononciation & Lecture A1 (A0-A1 Fondations)", track: "Prononciation", level: "A1" },
          { id: "fr-pron-a2", title: "Prononciation & Spoken French A2", track: "Prononciation", level: "A2" },
          { id: "fr-pron-b1", title: "Prononciation & Phonétique B1", track: "Prononciation", level: "B1" },
          { id: "fr-pron-b2", title: "Prononciation & Registres de langue B2", track: "Prononciation", level: "B2" },
          { id: "fr-pron-c1", title: "Prononciation & Diction poétique C1", track: "Prononciation", level: "C1" },
          { id: "fr-pron-c2", title: "Prononciation & Expertise орфоэпическая C2", track: "Prononciation", level: "C2" },
          { id: "general-french-a1", title: "Français Général A1", track: "Français Général", level: "A1" },
          { id: "general-french-a2", title: "Français Général A2", track: "Français Général", level: "A2" },
          { id: "spoken-french-b1", title: "Français Oral B1", track: "Français Oral", level: "B1" }
        ];

        let html = `
          <div class="catalog-container">
            <div style="margin-bottom: 24px;">
              <h1 style="font-size: 1.6rem; color: #0f172a;">🇫🇷 Catalogue Enseignant — Section Français</h1>
              <p style="color: #64748b;">Accès complet aux cursus, fiches pédagogiques Gabarit 14 Champs, CCQ et corrigés.</p>
            </div>
            <div class="catalog-grid">
        `;

        frenchCourses.forEach(course => {
          html += `
            <div class="course-card">
              <div>
                <span class="badge-teacher" style="margin-bottom: 8px; display: inline-block;">${course.level}</span>
                <h3 style="font-size: 1.15rem; color: #0f172a; margin-bottom: 6px;">${course.title}</h3>
                <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">Parcours: ${course.track}</p>
              </div>
              <a href="teacher.html?key=${key}&course=${course.id}&level=${course.level.toLowerCase()}" class="btn" style="background: var(--teacher-primary); text-align: center;">Ouvrir la feuille de route</a>
            </div>
          `;
        });

        html += `</div></div>`;
        appRoot.innerHTML = html;

      } catch (err) {
        renderAccessDenied("Erreur", err.message);
      }
    }

    function renderAccessDenied(title, message) {
      document.getElementById('app-root').innerHTML = `<div class="access-denied"><h2>🔒 ${title}</h2><p>${message}</p></div>`;
    }

    window.onload = initFrenchHub;
  </script>
</body>
</html>
