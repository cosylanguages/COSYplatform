name: Lesson Migration Preflight

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  migration-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch existing curriculum source from PR #13 history
        run: |
          git fetch --no-tags origin pull/13/head:refs/remotes/origin/pr/13
          git cat-file -e 33c54bab8d9c12ff5bd3202c76069f1782207087^{commit}

      - name: Focused science roadmap dry-run
        run: |
          node scripts/ingest_roadmaps.js \
            --source 33c54bab8d9c12ff5bd3202c76069f1782207087 \
            --roadmap science-en-b2.json \
            --dry-run

      - name: Full repository migration dry-run
        run: node scripts/ingest_roadmaps.js --source 33c54bab8d9c12ff5bd3202c76069f1782207087 --dry-run
