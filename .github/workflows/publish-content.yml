name: Publish Content to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'scripts/publish_to_supabase.js'
      - 'scripts/sanitize-student-lesson.js'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate content before publish
        run: |
          node scripts/check-content-integrity.js
          node scripts/check-lesson-languages.js
          node scripts/check_protected_keys.js

      - name: Publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish_to_supabase.js --prune
