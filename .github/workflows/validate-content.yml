name: Validate Content & Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check external references
        run: node scripts/check-external-refs.js

      - name: Install dependencies
        run: npm ci

      - name: Check content integrity
        run: node scripts/check-content-integrity.js

      - name: Check lesson languages
        run: node scripts/check-lesson-languages.js

      - name: Check protected keys
        run: node scripts/check_protected_keys.js

      - name: Run tests
        run: npm test
