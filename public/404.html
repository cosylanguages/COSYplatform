<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>COSYplatform</title>
    <script>
      // Turns /a/b?x=1 into /?/a/b&x=1 so index.html can restore it.
      // segments = number of path segments belonging to the site base (1 for /<repo>/, 0 for a domain root).
      var segments = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segments).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segments).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash
      );
    </script>
  </head>
</html>
