<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYlanguages Platform</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .footer-note {
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">COSYlanguages</div>
    <h1>Private Learning Platform</h1>
    <p>This is a private area. Access to lessons and teacher materials is available exclusively via direct personal link.</p>
    <div class="footer-note">
      Contact your teacher or COSYlanguages for a link to access your workspace.
    </div>
  </div>
</body>
</html>
