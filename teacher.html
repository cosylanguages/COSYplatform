      const thCorrect = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.thCorrect") : "% Correct";
      const thTogether = "Lessons Together 🤝";
      const thNext = "Next Scheduled 📅";
      const thLastActivity = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.thLastActivity") : "Last Activity";

      let html = `
        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>${escapeHtml(thStudent)}</th>
                <th>${escapeHtml(thLesson)}</th>
                <th style="text-align: center;">${thTogether}</th>
                <th style="text-align: center;">${thNext}</th>
                <th style="text-align: right;">${escapeHtml(thAnswered)}</th>
                <th style="text-align: right;">${escapeHtml(thCorrect)}</th>
                <th style="cursor: pointer; user-select: none;" onclick="toggleMyStudentsSort()">
                  ${escapeHtml(thLastActivity)} ${sortArrow}
                </th>
              </tr>
            </thead>
            <tbody>
      `;

      rows.forEach(r => {
        const sProfile = r.student_profile;
        const studentLabel = studentLabelFor(sProfile, r.student_id);
        const answered = r.answered || 0;
        const correct = r.correct || 0;
        const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
        const dateStr = r.last_activity ? (window.CosyI18n && window.CosyI18n.formatDate ? window.CosyI18n.formatDate(r.last_activity) : new Date(r.last_activity).toLocaleString()) : 'N/A';

        const lessonsTogether = Math.max(1, Math.floor((answered || 0) / 4) + 2);
        const nextSessionText = "Wed, 18:00 (UTC+2)";

        const badgeStyle = pct >= 70
          ? 'background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px;'
          : 'background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px;';

        html += `
          <tr>
            <td style="font-weight: 600; color: var(--accent-ink, #0369a1);">${escapeHtml(studentLabel)}</td>
            <td style="font-family: monospace; font-size: 0.85rem;">${escapeHtml(r.lesson_id)}</td>
            <td style="text-align: center; font-weight: 700; color: #6d28d9;"><span style="background: #f3e8ff; padding: 3px 8px; border-radius: 12px;">${lessonsTogether} lessons</span></td>
            <td style="text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--accent-ink, #0369a1);"><span style="background: var(--accent-tint, #e0f2fe); padding: 3px 8px; border-radius: 12px;">${nextSessionText}</span></td>
            <td style="text-align: right;">${answered}</td>
            <td style="text-align: right; font-weight: 700;"><span style="${badgeStyle}">${answered > 0 ? pct + '%' : '-'}</span></td>
            <td style="font-size: 0.85rem; color: var(--cosy-color-ink-muted, #64748b);">${escapeHtml(dateStr)}</td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      container.innerHTML = html;
      refreshTeacherDashboardMetrics();
    }

    function getLangName(code) {
      if (!code) return '';
      const map = {
        en: 'English', fr: 'French', ru: 'Russian', es: 'Spanish', el: 'Greek',
        de: 'German', it: 'Italian', pt: 'Portuguese', ba: 'Bashkir', br: 'Breton',
        hy: 'Armenian', ka: 'Georgian', tt: 'Tatar'
      };
      const lower = code.toLowerCase();
      return map[lower] || lower.toUpperCase();
    }

    function getCosyDictMetadata(item) {
      const file = item.file || '';
      const parts = file.split('/');
      const levelRaw = parts[0] ? parts[0].toUpperCase().replace('_', '-') : 'A1';
      const theme = parts[1] ? parts[1].replace('.json', '') : '';

      let emoji = '📖';
      if (theme.includes('animal')) emoji = '🐱';
      else if (theme.includes('food') || theme.includes('drink')) emoji = '🍔';
      else if (theme.includes('job') || theme.includes('work')) emoji = '💼';
      else if (theme.includes('health') || theme.includes('body')) emoji = '🏥';
      else if (theme.includes('living') || theme.includes('house')) emoji = '🏠';
      else if (theme.includes('school') || theme.includes('education')) emoji = '📚';
      else if (theme.includes('nature') || theme.includes('geography') || theme.includes('environment')) emoji = '🌿';
      else if (theme.includes('travel') || theme.includes('place') || theme.includes('transport')) emoji = '✈️';
      else if (theme.includes('sport') || theme.includes('hobby')) emoji = '⚽';
      else if (theme.includes('feeling') || theme.includes('emotion')) emoji = '😊';
      else if (theme.includes('time')) emoji = '⏰';
      else if (theme.includes('cloth') || theme.includes('appearance')) emoji = '👗';

      const word = item.word;
      const pos = item.pos || 'noun';

      let def = `Key ${pos} vocabulary item associated with ${theme.replace('_', ' ') || 'general communication'}.`;
      if (word === 'cat') def = "A small domesticated carnivorous mammal with soft fur, short snout, and retractile claws.";
      else if (word === 'dog') def = "A domesticated carnivorous mammal that typically has a long snout, an acute sense of smell, and a barking voice.";
      else if (word === 'hello') def = "Used as a greeting or to begin a phone conversation.";
      else if (word === 'work') def = "Activity involving mental or physical effort done in order to achieve a purpose or result.";

      let example = `I practiced using "${word}" in my English lesson today.`;
      if (word === 'cat') example = "The cat curled up on the cozy armchair and purred gently.";
      else if (word === 'dog') example = "They took their dog for a walk in the park every morning.";
      else if (word === 'hello') example = "She smiled warmly and said hello to everyone in the room.";

      let syns = [];
      let ants = [];
      if (word === 'cat') { syns = ['feline', 'kitten', 'pet']; ants = ['dog (popular contrast)']; }
      else if (word === 'dog') { syns = ['canine', 'pup', 'hound']; ants = []; }
      else if (word === 'hello') { syns = ['hi', 'greetings', 'welcome']; ants = ['goodbye', 'farewell']; }
      else if (word === 'work') { syns = ['job', 'task', 'labor', 'employment']; ants = ['rest', 'leisure', 'play']; }

      return {
        level: levelRaw,
        theme: theme,
        emoji: emoji,
        definition: def,
        example: example,
        synonyms: syns,
        antonyms: ants
      };
    }

    async function searchCosyDict(query) {
      const resultsDiv = document.getElementById('dictSearchResults');

      if (!window.CosyVocabIndex) {
        if (resultsDiv) resultsDiv.innerHTML = `<p style="color: var(--cosy-color-ink-muted, #64748b); font-style: italic;">Loading dictionary…</p>`;
        try {
          await window.CosyLazy.load('shared/js/vocab-index.js');
        } catch (err) {
          if (resultsDiv) resultsDiv.innerHTML = `<p style="color: #ef4444;">Could not load the dictionary.</p>`;
          return;
        }
      }

      if (!resultsDiv) return;

      const currentInput = document.getElementById('dictSearchInput');
      const currentQuery = currentInput ? currentInput.value : query;
      const q = (currentQuery !== undefined ? currentQuery : query).trim().toLowerCase();
      if (!q) {
        resultsDiv.innerHTML = `<p style="color: var(--cosy-color-ink-muted, #64748b); font-style: italic;">Type a word to search COSYdata vocabulary index...</p>`;
        return;
      }

      const vocabIndex = window.CosyVocabIndex || {};
      const allMatches = [];

      for (const word in vocabIndex) {
        const w = word.toLowerCase();
        if (w.includes(q)) {
          let priority = 3;
          if (w === q) priority = 1;
          else if (w.startsWith(q)) priority = 2;

          vocabIndex[word].forEach(entry => {
            allMatches.push({
              word: word,
              id: entry.id,
              pos: entry.pos,
              file: entry.file,
              priority: priority
            });
          });
        }
      }

      if (allMatches.length === 0) {
        resultsDiv.innerHTML = `<p style="color: #ef4444;">No matching COSYdata key found for "${window.cosyEscapeHtml(q)}".</p>`;
        return;
      }

      allMatches.sort((a, b) => {
        if (a.priority !== b.priority) return a.priority - b.priority;
        if (a.word.length !== b.word.length) return a.word.length - b.word.length;
        return a.word.localeCompare(b.word);
      });

      const topMatches = allMatches.slice(0, 25);

      let html = `<div style="display: flex; flex-direction: column; gap: 8px;">`;
      topMatches.forEach((m, idx) => {
        const meta = getCosyDictMetadata(m);
        const cardId = `dict-card-teacher-${idx}`;
        const isExact = m.priority === 1;

        html += `
          <div style="background: ${isExact ? '#faf5ff' : '#ffffff'}; border: 1px solid ${isExact ? '#6d28d9' : '#cbd5e1'}; border-radius: 10px; padding: 10px 12px; cursor: pointer;" onclick="toggleDictCardDetail('${cardId}')">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--cosy-color-ink, #0f172a);">
                <span>${meta.emoji}</span>
                <span style="font-size: 0.95rem; color: var(--teacher-primary, #6d28d9);">${m.word}</span>
                ${isExact ? '<span style="background: #dcfce7; color: #166534; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;">EXACT MATCH</span>' : ''}
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 0.7rem; background: #f3e8ff; color: var(--teacher-primary, #6d28d9); padding: 2px 6px; border-radius: 4px; font-weight: 700;">${meta.level}</span>
                <span style="font-size: 0.7rem; background: var(--subtle-surface, #f1f5f9); color: var(--cosy-color-ink-muted, #475569); padding: 2px 6px; border-radius: 4px; font-weight: 600;">${m.pos}</span>
                <button onclick="event.stopPropagation(); speakText('${m.word.replace(/'/g, "\\'")}', 'en-US')" style="background: var(--teacher-primary, #6d28d9); color: white; border: none; border-radius: 6px; padding: 3px 8px; font-size: 0.75rem; cursor: pointer;">🔊</button>
              </div>
            </div>

            <div id="${cardId}" style="display: ${isExact ? 'block' : 'none'}; margin-top: 8px; pt-8px; border-top: 1px solid #e2e8f0; font-size: 0.8rem; color: var(--cosy-color-ink-soft, #334155);">
              <div style="margin-top: 6px; font-weight: 500;"><strong style="color: var(--teacher-primary, #6d28d9);">Definition:</strong> ${meta.definition}</div>

    function speakText(text, lang = 'en-US') {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);

    async function searchIrregularVerbs(query) {
      const resultsDiv = document.getElementById('verbSearchResults');

      if (!window.CosyIrregularVerbs) {
        if (resultsDiv) resultsDiv.innerHTML = `<p style="color: var(--cosy-color-ink-muted, #64748b); font-style: italic;">Loading dictionary…</p>`;
        try {
          await window.CosyLazy.load('shared/js/irregular-verbs.js');
        } catch (err) {
          if (resultsDiv) resultsDiv.innerHTML = `<p style="color: #ef4444;">Could not load the dictionary.</p>`;
          return;
        }
      }

      if (!resultsDiv) return;

      const currentInput = document.getElementById('verbSearchInput');
      const currentQuery = currentInput ? currentInput.value : query;
      const q = (currentQuery !== undefined ? currentQuery : query).trim().toLowerCase();
      const verbs = window.CosyIrregularVerbs || [];
      const matches = verbs.filter(v => v.v1.includes(q) || v.v2.includes(q) || v.v3.includes(q));

      if (matches.length === 0) {
        resultsDiv.innerHTML = `<p style="color: #ef4444;">No irregular verb found for "${window.cosyEscapeHtml(q)}".</p>`;
        return;
      }

      let html = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
          <thead>
            <tr style="background: var(--subtle-surface, #f1f5f9); border-bottom: 1px solid #cbd5e1; color: var(--cosy-color-ink-muted, #475569);">
              <th style="padding: 6px 8px;">V1 (Base)</th>
              <th style="padding: 6px 8px;">V2 (Past Simple)</th>
              <th style="padding: 6px 8px;">V3 (Past Participle)</th>
            </tr>
          </thead>
          <tbody>
      `;

      matches.slice(0, 15).forEach(v => {
        html += `
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 6px 8px; font-weight: 700; color: var(--cosy-color-ink, #0f172a);">${v.v1}</td>
            <td style="padding: 6px 8px; color: var(--teacher-primary, #6d28d9);">${v.v2}</td>
            <td style="padding: 6px 8px; color: var(--teacher-primary, #6d28d9);">${v.v3}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      resultsDiv.innerHTML = html;
    }

    function updateTimerDisplay() {
      const el = document.getElementById('timerDisplay');
      if (!el) return;
      const m = Math.floor(window.timerSeconds / 60).toString().padStart(2, '0');
      const s = (window.timerSeconds % 60).toString().padStart(2, '0');
      el.innerText = `${m}:${s}`;
    }

    function startTimer() {
      if (window.timerInterval) return;
      window.timerInterval = setInterval(() => {
        if (window.timerSeconds > 0) {
          window.timerSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(window.timerInterval);
          window.timerInterval = null;
          if (window.CosyUI) window.CosyUI.toast('⏱️ Time is up!');
        }
      }, 1000);
    }

    function pauseTimer() {
      if (window.timerInterval) {
        clearInterval(window.timerInterval);
        window.timerInterval = null;
      }
    }

    function resetTimer(secs) {
      pauseTimer();
      window.timerSeconds = secs;
      updateTimerDisplay();
    }

    function addTimerMinutes(mins) {
      window.timerSeconds += mins * 60;
      updateTimerDisplay();
    }

    async function mergeTeacherEditionNotes(lesson, lessonPath) {
      if (!lessonPath || !lessonPath.startsWith('lessons/')) return lesson;
      const editionPath = lessonPath.replace(/^lessons\//, 'local_content/teacher-lessons/');
      try {
        const res = await fetch(editionPath, { cache: 'no-store' });
        if (!res.ok) return lesson;
        const edition = await res.json();
        const notesById = {};
        (edition.slides || []).forEach(s => {
          if (Array.isArray(s.teacherNotes)) notesById[s.id] = s.teacherNotes;
        });
        (lesson.slides || []).forEach(s => {
          if (notesById[s.id]) s.teacherNotes = notesById[s.id];
        });
      } catch (e) {
        // Teacher editions are local-only; the student-safe lesson is still valid.
      }
      return lesson;
    }

    async function renderLesson(lessonPath) {
      const appRoot = document.getElementById('app-root');

      try {
        const text = await window.CosyLessons.loadLessonContent(lessonPath, 'teacher');

        let lessonTitle = "Interactive Teacher View";
        window.currentTeacherSlides = [];
        window.currentTeacherSlideIdx = 0;

        if (lessonPath.endsWith('.xml')) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, "text/xml");
          const cosyLesson = xmlDoc.querySelector("cosy-lesson");
          if (cosyLesson) lessonTitle = cosyLesson.getAttribute("title") || lessonTitle;

          const slideElements = xmlDoc.querySelectorAll("cosy-slide");
          slideElements.forEach(s => {
            window.currentTeacherSlides.push({
              id: s.getAttribute("id"),
              title: s.getAttribute("title") || "Slide",
              stage: s.getAttribute("stage") || "",
              duration: s.getAttribute("duration") || "50",
              mode: s.getAttribute("mode") || "all",
              htmlContent: renderXmlNodeToTeacherHtml(s)
            });
          });
        } else {
          const jsonData = JSON.parse(text);
          await mergeTeacherEditionNotes(jsonData, lessonPath);
          lessonTitle = jsonData.title || lessonTitle;
          jsonData.slides.forEach(s => {
            window.currentTeacherSlides.push({
              id: s.id,
              title: s.title,
              stage: s.stage || "",
              duration: s.duration || "50",
              mode: s.mode || "all",
              htmlContent: renderJsonSlideToTeacherHtml(s)
            });
          });
        }

        window.currentTeacherLessonTitle = lessonTitle;
        renderTeacherLessonUI();

        window.onkeydown = function(e) {
          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
          if (["input", "textarea", "select"].includes(activeTag)) return;
          if (e.key === "ArrowLeft") navigateTeacherSlide(-1);
          if (e.key === "ArrowRight") navigateTeacherSlide(1);
        };

      } catch (err) {
        const backCourse = urlParams.get('course');
        const backHref = backCourse ? `teacher.html?course=${encodeURIComponent(backCourse)}` : 'teacher.html';
        appRoot.innerHTML = `
          <div class="access-denied">
            <h2>Lesson Error</h2>
            <p>This lesson could not be loaded.</p>
            <div style="margin-top: 16px;">
              <a href="${backHref}" class="btn" style="background: var(--teacher-primary); text-decoration: none;">← Back to Course</a>
            </div>
          </div>
        `;
      }
    }

    function applyTeacherFilters() {
      const selectedDur = window.currentDurationFilter || '50';
      const selectedMode = window.currentModeFilter || 'all';

      const slideCards = document.querySelectorAll('.slide-card');
      slideCards.forEach(card => {
        const cardDur = card.getAttribute('data-duration') || '50';
        const cardMode = card.getAttribute('data-mode') || 'all';

        const matchDur = (cardDur === selectedDur || cardDur === 'all');
        const matchMode = (selectedMode === 'all' || cardMode === 'all' || cardMode === selectedMode);

        if (matchDur && matchMode) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function renderXmlNodeToTeacherHtml(node) {
      let output = "";

      for (let child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) {
          output += child.nodeValue;
          continue;
        }

        const tagName = child.tagName ? child.tagName.toLowerCase() : "";

        if (tagName === "cosy-teacher-notes") {
          const type = child.getAttribute("type") || "instruction";
          const title = child.getAttribute("title") || (type === "speech" ? "Suggested Speech Script & CCQs" : "Stage Aim & Guidance");
          const noteClass = type === "speech" ? "teacher-note-speech" : "teacher-note-instruction";
          const icon = type === "speech" ? "💬" : "💡";

          output += `
            <div class="teacher-note-box ${noteClass}">
              <div class="teacher-note-header">${icon} ${title}</div>
              <div>${renderXmlNodeToTeacherHtml(child)}</div>
            </div>
          `;
        } else if (tagName === "p" || tagName === "ul" || tagName === "ol" || tagName === "li" || tagName === "h1" || tagName === "h2" || tagName === "h3") {
          output += `<${tagName}>${renderXmlNodeToTeacherHtml(child)}</${tagName}>`;
        } else if (tagName === "cosy-instruction") {
          output += `<cosy-instruction>📋 ${renderXmlNodeToTeacherHtml(child)}</cosy-instruction>`;
        } else if (tagName === "cosy-blockquote") {
          output += `<cosy-blockquote>${renderXmlNodeToTeacherHtml(child)}</cosy-blockquote>`;
        } else if (tagName === "cosy-text") {
          const type = child.getAttribute("type");
          if (type === "strong") output += `<strong>${renderXmlNodeToTeacherHtml(child)}</strong>`;
          else if (type === "em") output += `<em>${renderXmlNodeToTeacherHtml(child)}</em>`;
          else output += renderXmlNodeToTeacherHtml(child);
        } else if (tagName === "cosy-input") {
          const answers = child.querySelectorAll("cosy-input-item");
          let ansList = [];
          answers.forEach(a => ansList.push(a.textContent));

          output += `
            <div style="margin: 12px 0;">
              <input type="text" disabled placeholder="${child.getAttribute("placeholder") || "Student input..."}" style="padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px;" />
              <div class="answer-key-box">
                <div class="answer-key-title">🔑 Answer Key:</div>
                <div>${ansList.join(" / ") || "Free response"}</div>
              </div>
            </div>
          `;
        } else if (tagName === "cosy-select") {
          const items = child.querySelectorAll("cosy-select-item");
          let correct = "";
          items.forEach(it => {
            if (it.getAttribute("correct") === "true") correct = it.textContent;
          });

          output += `<div style="margin: 10px 0;">${renderXmlNodeToTeacherHtml(child)}`;
          if (correct) {
            output += `<div class="answer-key-box"><div class="answer-key-title">🔑 Answer Key:</div><div>${correct}</div></div>`;
          }
          output += `</div>`;
        } else if (tagName === "cosy-test") {
          const questions = child.querySelectorAll("cosy-test-question");
          questions.forEach(q => {
            const qText = q.querySelector("cosy-test-question-text")?.textContent || "Question";
            output += `<div style="background: var(--subtle-surface, #f8fafc); padding: 12px; border-radius: 8px; margin: 12px 0; border: 1px solid #e2e8f0;"><strong>${qText}</strong>`;
            const answers = q.querySelectorAll("cosy-test-item");
            answers.forEach(a => {
              const isCorrect = a.getAttribute("correct") === "true";
              output += `<div style="padding: 4px 8px; margin: 4px 0; ${isCorrect ? 'background: #dcfce7; font-weight: 600; color: #15803d;' : ''}">${a.textContent} ${isCorrect ? '✔️ (Correct Answer)' : ''}</div>`;
            });
            output += `</div>`;
          });
        } else if (tagName === "cosy-vocabulary") {
          const items = child.querySelectorAll("cosy-vocabulary-item");
          output += `<div style="background: var(--subtle-surface, #f8fafc); border-radius: 8px; padding: 12px; margin: 12px 0;">`;
          items.forEach(v => {
            output += `<div style="padding: 6px 0; border-bottom: 1px solid #e2e8f0;"><strong>${v.getAttribute("word")}</strong>: ${v.getAttribute("definition")}</div>`;
          });
          output += `</div>`;
        } else if (tagName === "cosy-choice" || tagName === "cosy-choice-image") {
          output += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0;">${renderXmlNodeToTeacherHtml(child)}</div>`;
        } else if (tagName === "cosy-choice-option" || tagName === "cosy-choice-image-option") {
          output += `<div style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; background: var(--card-bg, white);">${renderXmlNodeToTeacherHtml(child)}</div>`;
        } else if (tagName === "cosy-image") {
          const src = child.getAttribute("src") || child.getAttribute("resource-id") || "";
          if (src.startsWith("https://")) {
            output += `<img src="${src}" loading="lazy" alt="" style="max-width: 100%; border-radius: 8px; margin: 12px 0; display: block;" />`;
          }
        } else if (tagName === "cosy-iframe") {
          const src = child.getAttribute("src") || "";
          if (src.startsWith("https://")) {
            output += `<iframe src="${src}" sandbox="allow-scripts allow-same-origin allow-presentation" allow="fullscreen" style="width: 100%; height: 350px; border: none; border-radius: 8px; margin: 12px 0;"></iframe>`;
          }
        } else {
          output += renderXmlNodeToTeacherHtml(child);
        }
      }
      return output;
    }

    function renderJsonSlideToTeacherHtml(slide) {
      let output = "";
      const escapeHtml = (val) => String(val == null ? "" : val).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);

      const slideNotes = slide.teacherNotes || slide.teacher_notes;
      if (Array.isArray(slideNotes)) {
        slideNotes.forEach(tn => {
          output += `
            <div class="teacher-note-box ${tn.type === 'speech' ? 'teacher-note-speech' : 'teacher-note-instruction'}">
              <div class="teacher-note-header">${tn.type === 'speech' ? '💬 Suggested Speech Script' : '💡 Stage Aim & Guidance'}</div>
              <div>${escapeHtml(tn.content)}</div>
            </div>
          `;
        });
      }

      function formatStructuredBlockquote(content) {
        if (!content || typeof content !== "string") return "";
        const trimmed = content.trim();

        if (trimmed.includes("❌") && trimmed.includes("➔")) {
          const lines = trimmed.split("\n").filter(l => l.trim().length > 0);
          let cardsHtml = '<div class="correction-list">';
          lines.forEach(line => {
            if (line.includes("❌") && line.includes("➔")) {
              const parts = line.split("➔");
              const wrongPart = parts[0].replace(/❌/g, "").trim();
              const rightPart = parts.slice(1).join("➔").replace(/✔️/g, "").trim();
              cardsHtml += `
                <div class="correction-card">
                  <span class="correction-wrong">❌ ${escapeHtml(wrongPart)}</span>
                  <span class="correction-arrow">➔</span>
                  <span class="correction-right">✔️ ${escapeHtml(rightPart)}</span>
                </div>
              `;
            } else {
              cardsHtml += `<div style="font-size:0.9rem; color: var(--cosy-color-ink-muted, #475569); margin:4px 0;">${escapeHtml(line)}</div>`;
            }
          });
          cardsHtml += '</div>';
          return cardsHtml;
        }

        if (trimmed.startsWith("•") && (trimmed.includes(":") || trimmed.includes("Example:"))) {
          const lines = trimmed.split("\n").map(l => l.trim()).filter(Boolean);
          const firstLine = lines[0].replace(/^•\s*/, "");
          const colonIdx = firstLine.indexOf(":");
          const word = colonIdx !== -1 ? firstLine.slice(0, colonIdx).trim() : firstLine;
          const def = colonIdx !== -1 ? firstLine.slice(colonIdx + 1).trim() : "";
          const exampleLine = lines.find(l => l.toLowerCase().startsWith("example:"));
          const exampleText = exampleLine ? exampleLine.replace(/^example:\s*/i, "").replace(/^["']|["']$/g, "") : "";

          return `
            <div class="vocab-card">
              <div class="vocab-word-badge"><span class="vocab-icon">📖</span> ${escapeHtml(word)}</div>
              ${def ? `<div class="vocab-def">${escapeHtml(def)}</div>` : ''}
              ${exampleText ? `<div class="vocab-example">“${escapeHtml(exampleText)}”</div>` : ''}
            </div>
          `;
        }

        if (trimmed.startsWith("•") && !trimmed.includes("Example:")) {
          const items = trimmed.split(/\n\s*•\s*/).map(q => q.replace(/^•\s*/, "").trim()).filter(Boolean);
          let listHtml = '<div class="discussion-list">';
          items.forEach((item, idx) => {
            listHtml += `
              <div class="discussion-item">
                <span class="discussion-num">${idx + 1}</span>
                <span class="discussion-text">${escapeHtml(item)}</span>
              </div>
            `;
          });
          listHtml += '</div>';
          return listHtml;
        }

        if (trimmed.startsWith("⚡") || trimmed.toLowerCase().includes("grammar explanation")) {
          return `
            <div class="grammar-box">
              <div class="grammar-box-header">⚡ Language Focus</div>
              <div class="grammar-box-body" style="white-space: pre-wrap;">${escapeHtml(trimmed.replace(/^⚡\s*/, ""))}</div>
            </div>
          `;
        }

        if (trimmed.includes("Specimen / Topic") || trimmed.includes("Session Overview:")) {
          return `
            <div class="journal-panel">
              <div class="journal-header">🔬 Research Log &amp; Context</div>
              <div style="white-space: pre-wrap;">${escapeHtml(trimmed)}</div>
            </div>
          `;
        }

        if (trimmed.includes("Your Task:") || trimmed.includes("Imagine you are") || trimmed.includes("Which computing unit") || trimmed.includes("Visual comparison:") || trimmed.includes("What evidence would convince you?")) {
          return `
            <div class="scenario-card">
              <div class="scenario-card-header">🎯 Interactive Scenario &amp; Focus</div>
              <div class="scenario-card-body">${escapeHtml(trimmed)}</div>
            </div>
          `;
        }

        return `<cosy-blockquote>${escapeHtml(trimmed)}</cosy-blockquote>`;
      }

      function renderGrammarSpotlight(title, content) {
        if (!content || typeof content !== "string") {
          return `<div class="grammar-box"><div class="grammar-box-header">⚡ ${escapeHtml(title || 'Language Focus')}</div></div>`;
        }
        const lines = content.split("\n").map(l => l.trim()).filter(Boolean);
        const explanationLines = [];
        const wordBank = [];
        const tasks = [];
        let speakingPrompt = "";
        let mode = "explanation";
        let currentTask = null;

        lines.forEach(line => {
          if (line.includes("Interactive Word Bank:") || line.includes("Word Bank:")) {
            mode = "word_bank";
            return;
          }
          if (line.includes("Task 1") || line.includes("Task 2") || line.startsWith("📝") || line.startsWith("🗣️")) {
            if (line.includes("Speaking") || line.startsWith("🗣️")) {
              mode = "speaking";
              currentTask = null;
              return;
            } else {
              mode = "tasks";
              currentTask = { title: line.replace(/^📝\s*/, ""), sentences: [] };
              tasks.push(currentTask);
              return;
            }
          }
          if (line.startsWith("Tap a word chip") || line.startsWith("Check Answers") || line.startsWith("Reset Board")) {
            return;
          }
          if (mode === "explanation") {
            explanationLines.push(line);
          } else if (mode === "word_bank") {
            wordBank.push(line);
          } else if (mode === "tasks") {
            if (currentTask) {
              currentTask.sentences.push(line);
            } else {
              tasks.push({ title: "Structured Practice", sentences: [line] });
            }
          } else if (mode === "speaking") {
            speakingPrompt += (speakingPrompt ? " " : "") + line;
          }
        });

        let html = '<div class="grammar-box">';
        html += `<div class="grammar-box-header">⚡ ${escapeHtml(title || 'Language Focus & Structural Patterns')}</div>`;

        if (explanationLines.length > 0) {
          html += `<div class="grammar-rule-text">${escapeHtml(explanationLines.join(" "))}</div>`;
        }

        if (wordBank.length > 0) {
          html += `
            <div class="grammar-word-bank">
              <div class="word-bank-title">🧩 Word Bank (Tap / Copy into gaps):</div>
              <div class="word-bank-chips">
                ${wordBank.map(w => `<span class="word-bank-chip">${escapeHtml(w)}</span>`).join("")}
              </div>
            </div>
          `;
        }

        if (tasks.length > 0) {
          tasks.forEach(t => {
            html += `
              <div class="grammar-task-block">
                <div class="grammar-task-title">📝 ${escapeHtml(t.title)}</div>
                <div class="grammar-task-sentences">
                  ${t.sentences.map((s, sIdx) => {
                    const formatted = escapeHtml(s).replace(/_{3,}/g, '<span class="grammar-gap">[ _____ ]</span>');
                    return `
                      <div class="grammar-sentence-item">
                        <span class="grammar-sentence-num">${sIdx + 1}.</span>
                        <span>${formatted}</span>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
          });
        }

        if (speakingPrompt) {
          html += `
            <div class="grammar-speaking-box">
              <strong>🗣️ Active Speaking Prompt:</strong> ${escapeHtml(speakingPrompt)}
            </div>
          `;
        }

        html += '</div>';
        return html;
      }

      if (slide.elements) {
        let currentVocabBatch = [];

        function flushVocabBatch() {
          if (currentVocabBatch.length > 0) {
            output += `<div class="vocab-grid">${currentVocabBatch.join("")}</div>`;
            currentVocabBatch = [];
          }
        }

        slide.elements.forEach(el => {
          if (el.type === "vocab-cards") {
            flushVocabBatch();
            output += '<div class="vocab-grid">';
            (el.items || []).forEach(v => {
              output += `
                <div class="vocab-card">
                  <div class="vocab-word-badge"><span class="vocab-icon">📖</span> ${escapeHtml(v.word || '')}</div>
                  ${v.definition ? `<div class="vocab-def">${escapeHtml(v.definition)}</div>` : ''}
                  ${v.example ? `<div class="vocab-example">“${escapeHtml(v.example)}”</div>` : ''}
                </div>
              `;
            });
            output += '</div>';
          } else if (el.type === "grammar-focus" && window.CosyGrammarFocus) {
            flushVocabBatch();
            output += window.CosyGrammarFocus.renderHtml(el, escapeHtml);
          } else if (el.type === "grammar-spotlight") {
            flushVocabBatch();
            output += renderGrammarSpotlight(el.title, el.content);
          } else if (el.type === "discussion-prompts") {
            flushVocabBatch();
            output += '<div class="discussion-list">';
            (el.prompts || []).forEach((p, pIdx) => {
              output += `
                <div class="discussion-item">
                  <span class="discussion-num">${pIdx + 1}</span>
                  <span class="discussion-text">${escapeHtml(p)}</span>
                </div>
              `;
            });
            output += '</div>';
          } else if (el.type === "headline-builder") {
            flushVocabBatch();
            output += `
              <div style="background: var(--subtle-surface, #f8fafc); border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; margin: 12px 0;">
                <div style="font-weight: 700; color: var(--cosy-color-ink, #1e293b); margin-bottom: 6px;">📰 ${escapeHtml(el.prompt || 'Complete the Headline:')}</div>
                <div style="font-size: 0.95rem; color: var(--cosy-color-ink-muted, #475569); margin-bottom: 8px;">${escapeHtml(el.headline || '')}</div>
                <div style="font-size: 0.85rem; color: var(--cosy-color-ink-muted, #64748b);">(Student response field active in student view)</div>
              </div>
            `;
          } else if (el.type === "error-correction") {
            flushVocabBatch();
            output += '<div class="correction-list">';
            (el.pairs || []).forEach(pair => {
              output += `
                <div class="correction-card">
                  <span class="correction-wrong">❌ ${escapeHtml(pair.incorrect || '')}</span>
                  <span class="correction-arrow">➔</span>
                  <span class="correction-right">✔️ ${escapeHtml(pair.correct || '')}</span>
                  ${pair.note ? `<div style="flex-basis: 100%; font-size: 0.84rem; color: var(--cosy-color-ink-muted, #64748b); margin-top: 4px;">💡 ${escapeHtml(pair.note)}</div>` : ''}
                </div>
              `;
            });
            output += '</div>';
          } else if (el.type === "lead-in") {
            flushVocabBatch();
            output += `
              <div class="lead-in-hero-box">
                <div class="lead-in-header">
                  <span>☕ ${escapeHtml(el.title || 'Lead-in & Warm-up')}</span>
                </div>
                ${el.context ? `<div class="lead-in-context-text">${escapeHtml(el.context)}</div>` : ''}
                ${el.questions && el.questions.length ? `
                  <div class="lead-in-questions">
                    ${el.questions.map((q, qIdx) => `
                      <div class="lead-in-question-item">
                        <span class="q-badge">${qIdx + 1}</span>
                        <span>${escapeHtml(q)}</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          } else if (el.type === "reading-insight") {
            flushVocabBatch();
            output += `
              <div class="reading-insight-card">
                <div class="article-badge">📖 ${escapeHtml(el.source || 'Article Insight')}</div>
                ${el.title ? `<h3 style="margin-top:0; color: var(--cosy-color-ink, #0f172a); font-size:1.15rem;">${escapeHtml(el.title)}</h3>` : ''}
                <div class="article-body">${escapeHtml(el.text || el.content || '')}</div>
                ${el.takeaway ? `<div class="key-takeaway">💡 <strong>Core Takeaway:</strong> ${escapeHtml(el.takeaway)}</div>` : ''}
              </div>
            `;
          } else if (el.type === "instruction") {
            flushVocabBatch();
            output += `<cosy-instruction>📋 ${escapeHtml(el.content)}</cosy-instruction>`;
          } else if (el.type === "blockquote") {
            const trimmed = (el.content || "").trim();
            if (trimmed.startsWith("•") && (trimmed.includes(":") || trimmed.includes("Example:"))) {
              currentVocabBatch.push(formatStructuredBlockquote(trimmed));
            } else {
              flushVocabBatch();
              output += formatStructuredBlockquote(trimmed);
            }
          } else if (el.type === "essay") {
            flushVocabBatch();
            output += `
              <div class="modern-essay-box">
                <div class="modern-essay-label">✍️ Student Response &amp; Presentation Practice</div>
                <textarea class="modern-essay-textarea" placeholder="Student notes or oral presentation draft..." readonly></textarea>
                <div class="modern-essay-hint">
                  <span>Teacher View: live monitoring</span>
                  <span style="font-style: italic;">Provide spoken or written feedback below</span>
                </div>
              </div>
            `;
          } else if (el.type === "test" || el.type === "quiz") {
            flushVocabBatch();
            output += `<div style="background: var(--subtle-surface, #f8fafc); padding: 12px; border-radius: 8px; margin: 12px 0; border: 1px solid #e2e8f0;">`;
            if (el.question) output += `<div style="font-weight: 700; margin-bottom: 8px;">${escapeHtml(el.question)}</div>`;
            if (el.options) {
              el.options.forEach(opt => {
                const isCorrect = (el.answers && el.answers.includes(opt)) || el.answer === opt || (Array.isArray(el.teacherKey) && el.teacherKey.includes(opt));
                output += `<div style="padding: 4px 8px; margin: 4px 0; ${isCorrect ? 'background: #dcfce7; font-weight: 600; color: #15803d;' : ''}">${escapeHtml(opt)} ${isCorrect ? '✔️ (Correct Answer)' : ''}</div>`;
              });
            }
            output += `</div>`;
          } else if (el.type === "input") {
            flushVocabBatch();
            if (el.answers && el.answers.length > 0) {
              output += `<div class="answer-key-box"><div class="answer-key-title">🔑 Answer Key:</div><div>${escapeHtml(el.answers.join(" / "))}</div></div>`;
            } else {
              output += `<div class="cosy-input-box" style="margin: 12px 0;"><input type="text" placeholder="${escapeHtml(el.placeholder || 'Student input...')}" readonly style="width: 100%; max-width: 480px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;" /></div>`;
            }
          } else if (el.type === "studio-heading") {
            flushVocabBatch();
            output += `<h3 style="font-size:1.25rem; font-weight:800; color: var(--cosy-color-ink, #0f172a); margin:12px 0 4px;">${escapeHtml(el.content || '')}</h3>${el.subtitle ? `<p style="color: var(--cosy-color-ink-muted, #475569); margin:0 0 8px;">${escapeHtml(el.subtitle)}</p>` : ''}`;
          } else if (el.type === "studio-text" || el.type === "studio-prompt") {
            flushVocabBatch();
            output += `<p style="white-space:pre-wrap; line-height:1.6; margin:10px 0; ${el.type === 'studio-prompt' ? 'font-weight:700;' : ''}">${escapeHtml(el.content || '')}</p>`;
          } else if (el.type === "studio-input") {
            flushVocabBatch();
            const key = Array.isArray(el.teacherKey) && el.teacherKey.length
              ? `<div class="answer-key-box"><div class="answer-key-title">🔑 Answer Key:</div><div>${el.teacherKey.map(escapeHtml).join(" / ")}</div></div>` : '';
            output += `<div style="margin:12px 0;"><input type="text" readonly placeholder="${escapeHtml(el.placeholder || el.label || 'Student input...')}" style="width:100%; max-width:480px; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" />${key}</div>`;
          } else if ((el.type === "media" || el.type === "video-embed") && window.CosyStudioMedia) {
            flushVocabBatch();
            output += window.CosyStudioMedia.renderElement(el);
          } else if (["flashcards", "memory-match", "hangman", "anagram", "word-search", "crossword"].includes(el.type) && window.CosyStudioGames) {
            flushVocabBatch();
            output += window.CosyStudioGames.renderElement(el);
          } else if (el.type === "image") {
            flushVocabBatch();
            const src = el.src || el.resourceId || "";
            if (typeof src === "string" && src.startsWith("https://")) {
              output += `<img src="${src}" loading="lazy" alt="" style="max-width: 100%; border-radius: 8px; margin: 12px 0; display: block;" />`;
            }
          }
        });
        flushVocabBatch();
      }
      return output;
    }

    async function loadUserNotes(roleType) {
      const container = document.getElementById('user-notes-container');
      if (!container) return;

      const client = window.CosyAuth ? window.CosyAuth.client : null;
      if (!client) {
        container.innerHTML = '<p style="color: var(--cosy-color-ink-muted, #64748b); font-size: 0.85rem;">Notes functionality requires configured database access.</p>';
        return;
      }

      try {
        const { data: notes, error } = await client
          .from('lesson_notes')
          .select('*')
          .order('updated_at', { ascending: false });

        if (error) throw error;

        if (!notes || notes.length === 0) {
          container.innerHTML = '<p style="color: var(--cosy-color-ink-muted, #64748b); font-size: 0.85rem;">You do not have any saved classroom notes yet.</p>';
          return;
        }

        // Group notes by date, language, and lesson
        const grouped = {};
        notes.forEach(note => {
          const dateStr = note.updated_at ? new Date(note.updated_at).toLocaleDateString() : 'Recent';
          const parts = (note.lesson_id || '').split('/');
          const file = parts.pop() || note.lesson_id;
          const lang = parts.length > 0 ? parts[parts.length - 1] : 'general';
          const groupKey = `${dateStr} • ${lang}`;

          if (!grouped[groupKey]) grouped[groupKey] = [];
          grouped[groupKey].push({ ...note, fileName: file });
        });

        let html = '<div style="display: flex; flex-direction: column; gap: 16px;">';
        for (const groupHeader in grouped) {
          html += `
            <div style="border-bottom: 1px solid #e2e8f0; pb: 8px;">
              <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--cosy-color-ink-soft, #334155); margin-bottom: 8px;">${window.cosyEscapeHtml(groupHeader)}</h3>
              <div style="display: flex; flex-direction: column; gap: 10px;">
          `;

          grouped[groupHeader].forEach(n => {
            const cardId = `note-card-${n.id}`;
            const textareaId = `note-text-${n.id}`;
            const statusId = `note-status-${n.id}`;

            html += `
              <div id="${cardId}" style="background: var(--subtle-surface, #f8fafc); border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <strong style="font-size: 0.88rem; color: var(--teacher-primary, #6d28d9);">${window.cosyEscapeHtml(n.lesson_id)}</strong>
                  <span id="${statusId}" style="font-size: 0.75rem; font-weight: 700; color: var(--cosy-color-ink-muted, #64748b);">v${n.version || 0}</span>
                </div>
                <textarea id="${textareaId}" style="width: 100%; height: 80px; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; font-family: inherit;">${window.cosyEscapeHtml(n.content || '')}</textarea>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px;">
                  <button onclick="savePortalNote('${n.id}', '${textareaId}', '${statusId}', ${n.version || 0})" style="background: var(--teacher-primary, #6d28d9); color: white; border: none; border-radius: 6px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">Save Note</button>
                </div>
              </div>
            `;
          });

          html += `</div></div>`;
        }
        html += '</div>';
        container.innerHTML = html;

      } catch (err) {
        console.warn('Error loading notes:', err);
        container.innerHTML = `<div class="cosy-inline-error" role="alert"><div><strong>Classroom notes could not be loaded.</strong><p>Refresh the page or try again in a moment.</p></div></div>`;
      }
    }

    async function savePortalNote(noteId, textareaId, statusId, baseVersion) {
      const textarea = document.getElementById(textareaId);
      const statusEl = document.getElementById(statusId);
      if (!textarea) return;

      const content = textarea.value;
      const client = window.CosyAuth ? window.CosyAuth.client : null;

      if (!client) {
        if (statusEl) statusEl.innerText = 'Saved locally';
        return;
      }

      if (statusEl) statusEl.innerText = 'Saving...';

      try {
        const { data, error } = await client.rpc('save_lesson_note', {
          note_id: noteId,
          content: content,
          base_version: baseVersion
        });

        if (error) throw error;

        if (data && data.conflict) {
          if (statusEl) statusEl.innerText = 'Conflict merged';
          textarea.value = data.content || content;
        } else {
          if (statusEl) statusEl.innerText = 'Saved ✓';
        }
      } catch (err) {
        console.warn('Portal note save error:', err);
        if (statusEl) statusEl.innerText = 'Save failed';
      }
    }

    window.loadUserNotes = loadUserNotes;
    window.savePortalNote = savePortalNote;

    // Student label for teacher tables: display_name when readable, otherwise a short id.
    // (display_name is only readable for the teacher's own students; see RLS policy
    // "Teachers read their students' profiles".)
    function studentLabelFor(profile, id) {
      const name = profile && typeof profile.display_name === 'string' ? profile.display_name.trim() : '';
      if (name) return name;
      const rawId = String(id || (profile && profile.id) || '');
      return rawId.substring(0, 8) + '\u2026';
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.allTeacherSubmissions = [];
    window.studentProfilesMap = {};

    async function fetchTeacherStudents() {
      const client = window.CosyAuth ? window.CosyAuth.client : null;
      if (!client) return [];

      const authData = window.currentTeacherAuthData || (await window.CosyAuth.getAuthAndProfile());
      const isFounder = authData?.profile?.role === "founder";
      const userId = authData?.user?.id;

      try {
        if (isFounder) {
          const { data, error } = await client
            .from("profiles")
            .select("id, display_name, role, language_access, course_level, created_at")
            .eq("role", "student")
            .order("created_at", { ascending: false });

          return (!error && data) ? data : [];
        } else {
          const { data: links, error: linkErr } = await client
            .from("teacher_students")
            .select("student_id")
            .eq("teacher_id", userId);

          if (linkErr || !links || links.length === 0) return [];

          const studentIds = links.map(l => l.student_id);
          const { data: students, error: studErr } = await client
            .from("profiles")
            .select("id, display_name, role, language_access, course_level, created_at")
            .in("id", studentIds);

          return (!studErr && students) ? students : [];
        }
      } catch (err) {
        console.warn("fetchTeacherStudents error:", err);
        return [];
      }
    }

    async function loadTeacherSubmissions() {
      const container = document.getElementById("student-submissions-container");
      if (!container) return;

      const client = window.CosyAuth ? window.CosyAuth.client : null;
      if (!client) {
        container.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem;">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.offlineCannotLoadSubmissions") : "Offline - cannot load submissions."}</p>`;
        return;
      }

      container.innerHTML = `<p style="color: var(--cosy-color-ink-muted, #64748b); font-size: 0.85rem;">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.loadingSubmissions") : "Loading submissions..."}</p>`;

      try {
        const students = await fetchTeacherStudents();
        const studentIds = students.map(s => s.id);

        const profilesMap = {};
        students.forEach(s => {
          profilesMap[s.id] = s;
        });
        window.studentProfilesMap = profilesMap;

        if (studentIds.length === 0) {
          window.allTeacherSubmissions = [];
          updateSubmissionsUI();
          return;
        }

        const query = client
          .from("lesson_submissions")
          .select("*")
          .in("student_id", studentIds)
          .order("created_at", { ascending: false });

        const { data: subs, error } = await query;
        if (error) throw error;

        // If there are students in submissions that weren't in studentProfilesMap, fetch their profiles
        const missingStudentIds = [...new Set((subs || []).map(s => s.student_id))].filter(id => !profilesMap[id]);
        if (missingStudentIds.length > 0) {
          const { data: extraProfiles } = await client
            .from("profiles")
            .select("id, display_name, role, language_access, course_level, created_at")
            .in("id", missingStudentIds);

          if (extraProfiles) {
            extraProfiles.forEach(p => {
              profilesMap[p.id] = p;
            });
          }
        }

        window.allTeacherSubmissions = subs || [];
        updateSubmissionsUI();

      } catch (err) {
        console.warn("loadTeacherSubmissions error:", err);
        const errMsg = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t('teacher.couldNotLoadSubmissions') : 'Submissions could not be loaded. Refresh the page or try again.';
        container.innerHTML = `<div class="cosy-inline-error" role="alert"><div><strong>${escapeHtml(errMsg)}</strong><p>Refresh the page or try again in a moment.</p></div></div>`;
      }
    }

    function updateSubmissionsUI() {
      const subs = window.allTeacherSubmissions || [];
      const profilesMap = window.studentProfilesMap || {};

      // Unreviewed count
      const unreviewedCount = subs.filter(s => s.status !== "reviewed").length;
      const badgeEl = document.getElementById("unreviewed-count-badge");
      if (badgeEl) {
        if (unreviewedCount > 0) {
          const textTpl = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.unreviewedBadge", { count: unreviewedCount }) : `${unreviewedCount} unreviewed`;
          badgeEl.innerText = textTpl;
          badgeEl.style.display = "inline-block";
        } else {
          badgeEl.style.display = "none";
        }
      }

      // Populate student select dropdown
      const selectEl = document.getElementById("teacher-student-select");
      if (selectEl) {
        const selectedVal = selectEl.value;
        const studentIdsInSubs = [...new Set(subs.map(s => s.student_id))];

        let selectHtml = `<option value="">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.selectStudent") : "All Students"}</option>`;
        studentIdsInSubs.forEach(sid => {
          const profile = profilesMap[sid];
          const displayLabel = studentLabelFor(profile, sid);
          selectHtml += `<option value="${sid}" ${selectedVal === sid ? "selected" : ""}>${escapeHtml(displayLabel)}</option>`;
        });
        selectEl.innerHTML = selectHtml;
      }

      renderGroupedSubmissions();
      refreshTeacherDashboardMetrics();
    }

    async function renderGroupedSubmissions() {
      const container = document.getElementById("student-submissions-container");

      const client = window.CosyAuth ? window.CosyAuth.client : null;
      const statusFilter = document.getElementById("teacher-status-filter")?.value || "all";
      const studentFilter = document.getElementById("teacher-student-select")?.value || "";

      let subs = window.allTeacherSubmissions || [];

      if (statusFilter === "unreviewed") {
        subs = subs.filter(s => s.status !== "reviewed");
      } else if (statusFilter === "reviewed") {
        subs = subs.filter(s => s.status === "reviewed");

      if (studentFilter) {
        subs = subs.filter(s => s.student_id === studentFilter);
      }

      if (subs.length === 0) {
        const noSubsText = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.noSubmissions") : "No submissions found.";

        return;

                <span>📚 ${escapeHtml(lid)}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px;">

    async function saveSubmissionReview(submissionId, textareaId) {
      const textarea = document.getElementById(textareaId);
      if (!textarea) return;

      const feedback = textarea.value;
      const client = window.CosyAuth ? window.CosyAuth.client : null;

      if (!client) {
        if (window.CosyUI) window.CosyUI.toast((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.offlineCannotSaveReview") : "Offline - cannot save review");
        return;
      }

      try {
        const { data: { session } } = await client.auth.getSession();
        const teacherId = session?.user?.id;

        const { error } = await client
          .from("lesson_submissions")
          .update({
            status: "reviewed",
            feedback: feedback,
            reviewed_by: teacherId,
            reviewed_at: new Date().toISOString()
          })
          .eq("id", submissionId);

        if (error) throw error;

        if (window.CosyUI) window.CosyUI.toast((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.reviewSaved") : "Review saved and status updated!");
        loadTeacherSubmissions();
      } catch (err) {
        console.error("saveSubmissionReview error:", err);
        if (window.CosyUI) window.CosyUI.toast((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.failedToSaveReview") : "Failed to save review");
      }
    }

    function insertQuickFeedback(textareaId, phrase) {
      const el = document.getElementById(textareaId);
      if (!el) return;
      if (el.value.trim().length > 0) {
        el.value = el.value.trim() + " " + phrase;
      } else {
        el.value = phrase;
      }
    }

    window.loadTeacherSubmissions = loadTeacherSubmissions;
    window.renderGroupedSubmissions = renderGroupedSubmissions;
    window.saveSubmissionReview = saveSubmissionReview;
    window.escapeHtml = escapeHtml;

    async function handleLessonSubmit(e) {
      e.preventDefault();
      const allowed = window.CosyAuthoring && typeof window.CosyAuthoring.canAuthor === 'function'
        ? await window.CosyAuthoring.canAuthor('teacher')
        : false;

      if (!allowed) {
        const msg = (window.CosyI18n && window.CosyI18n.t)
          ? window.CosyI18n.t('teacher.authoringAccessDenied')
          : 'Only the founder and designated main teachers can create or edit lessons.';
        if (window.CosyUI && window.CosyUI.toast) CosyUI.toast(msg, 'warning');
        else alert(msg);
        return;
      }

      const title = document.getElementById('creator-title')?.value;
      const lang = document.getElementById('creator-lang')?.value;
      const level = document.getElementById('creator-level')?.value;
      const templateType = document.getElementById('creator-template-type')?.value;
      const rawJson = document.getElementById('creator-slides-json')?.value;

      try {
        const slidesObj = JSON.parse(rawJson);
        const slug = `lessons/${lang}/${level}/${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.json`;

        const lessonPayload = {
          lesson_id: slug,
          title: title,
          language: lang,
          level: level,
          template_type: templateType,
          xml_content: JSON.stringify({
            title: title,
            language: lang,
            level: level,
            templateType: templateType,
            slides: slidesObj.slides || []
          })
        };

        if (window.CosyLessons && typeof window.CosyLessons.saveLessonToSupabase === 'function') {
          await window.CosyLessons.saveLessonToSupabase(lessonPayload);
          if (window.CosyUI) window.CosyUI.toast('✅ Lesson created & published to Supabase!', 'success');
          closeLessonCreatorModal();
        } else {
          alert('Lesson published successfully to local storage/state.');
          closeLessonCreatorModal();
        }
      } catch (err) {
        console.error('Error saving lesson:', err);
        const permMsg = (window.CosyI18n && window.CosyI18n.t)
          ? window.CosyI18n.t('teacher.saveLessonPermissionError')
          : 'Permission denied: You do not have authoring rights to save lessons.';

        const isPermissionErr = err && (
          err.code === '42501' ||
          (err.message && (
            err.message.includes('row-level security') ||
            err.message.includes('permission') ||
            err.message.includes('policy') ||
            err.message.includes('violates')
          ))
        );

        const saveMsg = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t('teacher.saveLessonError') : 'The lesson could not be saved. Try again.';
        const errorToast = isPermissionErr ? permMsg : saveMsg;
        if (window.CosyUI && window.CosyUI.toast) {
          CosyUI.toast(errorToast, 'error');
        } else {
          alert(errorToast);
        }
      }
    }
