    function renderXmlNodeToTeacherHtml(node) {
      let output = "";

      for (let child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) {
          output += child.nodeValue;
          continue;
        }

        const tagName = child.tagName ? child.tagName.toLowerCase() : "";

        if (tagName === "cosy-teacher-notes") {
          const type = child.getAttribute("type") || "instruction";
          const title = child.getAttribute("title") || (type === "speech" ? "Suggested Speech Script & CCQs" : "Stage Aim & Guidance");
          const noteClass = type === "speech" ? "teacher-note-speech" : "teacher-note-instruction";
          const icon = type === "speech" ? "💬" : "💡";

          output += `
            <div class="teacher-note-box ${noteClass}">
              <div class="teacher-note-header">${icon} ${title}</div>
              <div>${renderXmlNodeToTeacherHtml(child)}</div>
            </div>
          `;
        } else if (tagName === "p" || tagName === "ul" || tagName === "ol" || tagName === "li" || tagName === "h1" || tagName === "h2" || tagName === "h3") {
          output += `<${tagName}>${renderXmlNodeToTeacherHtml(child)}</${tagName}>`;
        } else if (tagName === "cosy-instruction") {
          output += `<cosy-instruction>📋 ${renderXmlNodeToTeacherHtml(child)}</cosy-instruction>`;
        } else if (tagName === "cosy-blockquote") {
          output += `<cosy-blockquote>${renderXmlNodeToTeacherHtml(child)}</cosy-blockquote>`;
        } else if (tagName === "cosy-text") {
          const type = child.getAttribute("type");
          if (type === "strong") output += `<strong>${renderXmlNodeToTeacherHtml(child)}</strong>`;
          else if (type === "em") output += `<em>${renderXmlNodeToTeacherHtml(child)}</em>`;
          else output += renderXmlNodeToTeacherHtml(child);
        } else if (tagName === "cosy-input") {
          const answers = child.querySelectorAll("cosy-input-item");
          let ansList = [];
          answers.forEach(a => ansList.push(a.textContent));

          output += `
            <div style="margin: 12px 0;">
              <input type="text" disabled placeholder="${child.getAttribute("placeholder") || "Student input..."}" style="padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px;" />
              <div class="answer-key-box">
                <div class="answer-key-title">🔑 Answer Key:</div>
                <div>${ansList.join(" / ") || "Free response"}</div>
              </div>
            </div>
          `;
        } else if (tagName === "cosy-select") {
          const items = child.querySelectorAll("cosy-select-item");
          let correct = "";
          items.forEach(it => {
            if (it.getAttribute("correct") === "true") correct = it.textContent;
          });

          output += `<div style="margin: 10px 0;">${renderXmlNodeToTeacherHtml(child)}`;
          if (correct) {
            output += `<div class="answer-key-box"><div class="answer-key-title">🔑 Answer Key:</div><div>${correct}</div></div>`;
          }
          output += `</div>`;
        } else if (tagName === "cosy-test") {
          const questions = child.querySelectorAll("cosy-test-question");
          questions.forEach(q => {
            const qText = q.querySelector("cosy-test-question-text")?.textContent || "Question";
            output += `<div style="background: #f8fafc; padding: 12px; border-radius: 8px; margin: 12px 0; border: 1px solid #e2e8f0;"><strong>${qText}</strong>`;
            const answers = q.querySelectorAll("cosy-test-item");
            answers.forEach(a => {
              const isCorrect = a.getAttribute("correct") === "true";
              output += `<div style="padding: 4px 8px; margin: 4px 0; ${isCorrect ? 'background: #dcfce7; font-weight: 600; color: #15803d;' : ''}">${a.textContent} ${isCorrect ? '✔️ (Correct Answer)' : ''}</div>`;
            });
            output += `</div>`;
          });
        } else if (tagName === "cosy-vocabulary") {
          const items = child.querySelectorAll("cosy-vocabulary-item");
          output += `<div style="background: #f8fafc; border-radius: 8px; padding: 12px; margin: 12px 0;">`;
          items.forEach(v => {
            output += `<div style="padding: 6px 0; border-bottom: 1px solid #e2e8f0;"><strong>${v.getAttribute("word")}</strong>: ${v.getAttribute("definition")}</div>`;
          });
          output += `</div>`;
        } else if (tagName === "cosy-choice" || tagName === "cosy-choice-image") {
          output += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0;">${renderXmlNodeToTeacherHtml(child)}</div>`;
        } else if (tagName === "cosy-choice-option" || tagName === "cosy-choice-image-option") {
          output += `<div style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; background: white;">${renderXmlNodeToTeacherHtml(child)}</div>`;
        } else if (tagName === "cosy-image") {
          const src = child.getAttribute("src") || child.getAttribute("resource-id") || "";
          if (src.startsWith("https://")) {
            output += `<img src="${src}" loading="lazy" alt="" style="max-width: 100%; border-radius: 8px; margin: 12px 0; display: block;" />`;
          }
        } else if (tagName === "cosy-iframe") {
          const src = child.getAttribute("src") || "";
          if (src.startsWith("https://")) {
            output += `<iframe src="${src}" sandbox="allow-scripts allow-same-origin allow-presentation" allow="fullscreen" style="width: 100%; height: 350px; border: none; border-radius: 8px; margin: 12px 0;"></iframe>`;
          }
        } else {
          output += renderXmlNodeToTeacherHtml(child);
        }
      }
      return output;
    }

    function renderJsonSlideToTeacherHtml(slide) {
      let output = "";
      if (slide.teacherNotes) {
        slide.teacherNotes.forEach(tn => {
          output += `
            <div class="teacher-note-box ${tn.type === 'speech' ? 'teacher-note-speech' : 'teacher-note-instruction'}">
              <div class="teacher-note-header">${tn.type === 'speech' ? '💬 Suggested Speech Script' : '💡 Stage Aim & Guidance'}</div>
              <div>${tn.content}</div>
            </div>
          `;
        });
      }
      if (slide.elements) {
        slide.elements.forEach(el => {
          if (el.type === "instruction") output += `<cosy-instruction>📋 ${el.content}</cosy-instruction>`;
          else if (el.type === "blockquote") output += `<cosy-blockquote>${el.content}</cosy-blockquote>`;
          else if (el.type === "test") {
            output += `<div style="background: #f8fafc; padding: 12px; border-radius: 8px; margin: 12px 0; border: 1px solid #e2e8f0;">`;
            if (el.options) {
              el.options.forEach(opt => {
                const isCorrect = el.answers && el.answers.includes(opt);
                output += `<div style="padding: 4px 8px; margin: 4px 0; ${isCorrect ? 'background: #dcfce7; font-weight: 600; color: #15803d;' : ''}">${opt} ${isCorrect ? '✔️ (Correct Answer)' : ''}</div>`;
              });
            }
            output += `</div>`;
          } else if (el.type === "input" && el.answers) {
            output += `<div class="answer-key-box"><div class="answer-key-title">🔑 Answer Key:</div><div>${el.answers.join(" / ")}</div></div>`;
          } else if (el.type === "image") {
            const src = el.src || el.resourceId || "";
            if (typeof src === "string" && src.startsWith("https://")) {
              output += `<img src="${src}" loading="lazy" alt="" style="max-width: 100%; border-radius: 8px; margin: 12px 0; display: block;" />`;
            }
          }
        });
      }
      return output;
    }

    async function loadUserNotes(roleType) {
      const container = document.getElementById('user-notes-container');
      if (!container) return;

      const client = window.CosyAuth ? window.CosyAuth.client : null;
      if (!client) {
        container.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">Notes functionality requires configured database access.</p>';
        return;
      }

      try {
        const { data: notes, error } = await client
          .from('lesson_notes')
          .select('*')
          .order('updated_at', { ascending: false });

        if (error) throw error;

        if (!notes || notes.length === 0) {
          container.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">You do not have any saved classroom notes yet.</p>';
          return;
        }

        // Group notes by date, language, and lesson
        const grouped = {};
        notes.forEach(note => {
          const dateStr = note.updated_at ? new Date(note.updated_at).toLocaleDateString() : 'Recent';
          const parts = (note.lesson_id || '').split('/');
          const file = parts.pop() || note.lesson_id;
          const lang = parts.length > 0 ? parts[parts.length - 1] : 'general';
          const groupKey = `${dateStr} • ${lang}`;

          if (!grouped[groupKey]) grouped[groupKey] = [];
          grouped[groupKey].push({ ...note, fileName: file });
        });

        let html = '<div style="display: flex; flex-direction: column; gap: 16px;">';
        for (const groupHeader in grouped) {
          html += `
            <div style="border-bottom: 1px solid #e2e8f0; pb: 8px;">
              <h3 style="font-size: 0.95rem; font-weight: 700; color: #334155; margin-bottom: 8px;">${groupHeader}</h3>
              <div style="display: flex; flex-direction: column; gap: 10px;">
          `;

          grouped[groupHeader].forEach(n => {
            const cardId = `note-card-${n.id}`;
            const textareaId = `note-text-${n.id}`;
            const statusId = `note-status-${n.id}`;

            html += `
              <div id="${cardId}" style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <strong style="font-size: 0.88rem; color: var(--teacher-primary, #6d28d9);">${n.lesson_id}</strong>
                  <span id="${statusId}" style="font-size: 0.75rem; font-weight: 700; color: #64748b;">v${n.version || 0}</span>
                </div>
                <textarea id="${textareaId}" style="width: 100%; height: 80px; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; font-family: inherit;">${n.content || ''}</textarea>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px;">
                  <button onclick="savePortalNote('${n.id}', '${textareaId}', '${statusId}', ${n.version || 0})" style="background: var(--teacher-primary, #6d28d9); color: white; border: none; border-radius: 6px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">Save Note</button>
                </div>
              </div>
            `;
          });

          html += `</div></div>`;
        }
        html += '</div>';
        container.innerHTML = html;

      } catch (err) {
        console.warn('Error loading notes:', err);
        container.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem;">Could not load notes: ${err.message || 'Error'}</p>`;
      }
    }

    async function savePortalNote(noteId, textareaId, statusId, baseVersion) {
      const textarea = document.getElementById(textareaId);
      const statusEl = document.getElementById(statusId);
      if (!textarea) return;

      const content = textarea.value;
      const client = window.CosyAuth ? window.CosyAuth.client : null;

      if (!client) {
        if (statusEl) statusEl.innerText = 'Saved locally';
        return;
      }

      if (statusEl) statusEl.innerText = 'Saving...';

      try {
        const { data, error } = await client.rpc('save_lesson_note', {
          note_id: noteId,
          content: content,
          base_version: baseVersion
        });

        if (error) throw error;

        if (data && data.conflict) {
          if (statusEl) statusEl.innerText = 'Conflict merged';
          textarea.value = data.content || content;
        } else {
          if (statusEl) statusEl.innerText = 'Saved ✓';
        }
      } catch (err) {
        console.warn('Portal note save error:', err);
        if (statusEl) statusEl.innerText = 'Save failed';
      }
    }

    window.loadUserNotes = loadUserNotes;
    window.savePortalNote = savePortalNote;

    // Student label for teacher tables: display_name when readable, otherwise a short id.
    // (display_name is only readable for the teacher's own students; see RLS policy
    // "Teachers read their students' profiles".)
    function studentLabelFor(profile, id) {
      const name = profile && typeof profile.display_name === 'string' ? profile.display_name.trim() : '';
      if (name) return name;
      const rawId = String(id || (profile && profile.id) || '');
      return rawId.substring(0, 8) + '\u2026';
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.allTeacherSubmissions = [];
    window.studentProfilesMap = {};

    async function fetchTeacherStudents() {
      const client = window.CosyAuth ? window.CosyAuth.client : null;
      if (!client) return [];

      const authData = window.currentTeacherAuthData || (await window.CosyAuth.getAuthAndProfile());
      const isFounder = authData?.profile?.role === "founder";
      const userId = authData?.user?.id;

      try {
        if (isFounder) {
          const { data, error } = await client
            .from("profiles")
            .select("id, display_name, role, language_access, course_level, created_at")
            .neq("role", "founder")
            .order("created_at", { ascending: false });

          return (!error && data) ? data : [];
        } else {
          const { data: links, error: linkErr } = await client
            .from("teacher_students")
            .select("student_id")
            .eq("teacher_id", userId);

          if (linkErr || !links || links.length === 0) return [];

          const studentIds = links.map(l => l.student_id);
          const { data: students, error: studErr } = await client
            .from("profiles")
            .select("id, display_name, role, language_access, course_level, created_at")
            .in("id", studentIds);

          return (!studErr && students) ? students : [];
        }
      } catch (err) {
        console.warn("fetchTeacherStudents error:", err);
        return [];
      }
    }

    async function loadTeacherSubmissions() {
      const container = document.getElementById("student-submissions-container");
      if (!container) return;

      const client = window.CosyAuth ? window.CosyAuth.client : null;
      if (!client) {
        container.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem;">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.offlineCannotLoadSubmissions") : "Offline - cannot load submissions."}</p>`;
        return;
      }

      container.innerHTML = `<p style="color: #64748b; font-size: 0.85rem;">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.loadingSubmissions") : "Loading submissions..."}</p>`;

      try {
        const students = await fetchTeacherStudents();
        const studentIds = students.map(s => s.id);

        const profilesMap = {};
        students.forEach(s => {
          profilesMap[s.id] = s;
        });
        window.studentProfilesMap = profilesMap;

        let query = client.from("lesson_submissions").select("*").order("created_at", { ascending: false });

        const authData = window.currentTeacherAuthData;
        const isFounder = authData?.profile?.role === "founder";
        if (!isFounder && studentIds.length > 0) {
          query = query.in("student_id", studentIds);
        } else if (!isFounder && studentIds.length === 0) {
          window.allTeacherSubmissions = [];
          updateSubmissionsUI();
          return;
        }

        const { data: subs, error } = await query;
        if (error) throw error;

        // If there are students in submissions that weren't in studentProfilesMap, fetch their profiles
        const missingStudentIds = [...new Set((subs || []).map(s => s.student_id))].filter(id => !profilesMap[id]);
        if (missingStudentIds.length > 0) {
          const { data: extraProfiles } = await client
            .from("profiles")
            .select("id, display_name, role, language_access, course_level, created_at")
            .in("id", missingStudentIds);

          if (extraProfiles) {
            extraProfiles.forEach(p => {
              profilesMap[p.id] = p;
            });
          }
        }

        window.allTeacherSubmissions = subs || [];
        updateSubmissionsUI();

      } catch (err) {
        console.warn("loadTeacherSubmissions error:", err);
        const errMsg = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.couldNotLoadSubmissions", { error: err.message }) : `Could not load submissions: ${err.message}`;
        container.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem;">${escapeHtml(errMsg)}</p>`;
      }
    }

    function updateSubmissionsUI() {
      const subs = window.allTeacherSubmissions || [];
      const profilesMap = window.studentProfilesMap || {};

      // Unreviewed count
      const unreviewedCount = subs.filter(s => s.status !== "reviewed").length;
      const badgeEl = document.getElementById("unreviewed-count-badge");
      if (badgeEl) {
        if (unreviewedCount > 0) {
          const textTpl = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.unreviewedBadge", { count: unreviewedCount }) : `${unreviewedCount} unreviewed`;
          badgeEl.innerText = textTpl;
          badgeEl.style.display = "inline-block";
        } else {
          badgeEl.style.display = "none";
        }
      }

      // Populate student select dropdown
      const selectEl = document.getElementById("teacher-student-select");
      if (selectEl) {
        const selectedVal = selectEl.value;
        const studentIdsInSubs = [...new Set(subs.map(s => s.student_id))];

        let selectHtml = `<option value="">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.selectStudent") : "All Students"}</option>`;
        studentIdsInSubs.forEach(sid => {
          const profile = profilesMap[sid];
          const displayLabel = studentLabelFor(profile, sid);
          selectHtml += `<option value="${sid}" ${selectedVal === sid ? "selected" : ""}>${escapeHtml(displayLabel)}</option>`;
        });
        selectEl.innerHTML = selectHtml;
      }

      renderGroupedSubmissions();
    }

    async function renderGroupedSubmissions() {
      const container = document.getElementById("student-submissions-container");
      if (!container) return;

      const client = window.CosyAuth ? window.CosyAuth.client : null;
      const statusFilter = document.getElementById("teacher-status-filter")?.value || "all";
      const studentFilter = document.getElementById("teacher-student-select")?.value || "";

      let subs = window.allTeacherSubmissions || [];

      if (statusFilter === "unreviewed") {
        subs = subs.filter(s => s.status !== "reviewed");
      } else if (statusFilter === "reviewed") {
        subs = subs.filter(s => s.status === "reviewed");
      }

      if (studentFilter) {
        subs = subs.filter(s => s.student_id === studentFilter);
      }

      if (subs.length === 0) {
        const noSubsText = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.noSubmissions") : "No submissions found.";
        container.innerHTML = `<p style="color: #64748b; font-size: 0.85rem;">${noSubsText}</p>`;
        return;
      }

      // Group by student then lesson
      const grouped = {};
      subs.forEach(s => {
        const sid = s.student_id;
        const lid = s.lesson_id;
        if (!grouped[sid]) grouped[sid] = {};
        if (!grouped[sid][lid]) grouped[sid][lid] = [];
        grouped[sid][lid].push(s);
      });

      const profilesMap = window.studentProfilesMap || {};
      let html = '<div style="display: flex; flex-direction: column; gap: 20px;">';

      for (const sid in grouped) {
        const profile = profilesMap[sid];
        const studentLabel = studentLabelFor(profile, sid);

        html += `
          <div style="border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background: #fafafa;">
            <div style="font-weight: 700; color: #0369a1; font-size: 0.95rem; margin-bottom: 12px; border-bottom: 1px solid #cbd5e1; padding-bottom: 6px;">
              <span>👤 ${escapeHtml(studentLabel)}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 14px;">
        `;

        for (const lid in grouped[sid]) {
          const lessonSubs = grouped[sid][lid];

          html += `
            <div style="background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px;">
              <div style="font-weight: 700; font-size: 0.88rem; color: #0f172a; margin-bottom: 10px;">
                <span>📚 ${escapeHtml(lid)}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px;">
          `;

          for (const sub of lessonSubs) {
            const subId = `${sub.student_id}_${sub.lesson_id}_${sub.field_key}`.replace(/[^a-zA-Z0-9_-]/g, "_");
            const textareaId = `feedback_txt_${subId}`;
            const isAudio = sub.kind === "audio";

            let audioHtml = "";
            if (isAudio && sub.audio_path && client) {
              const { data: signedData } = await client.storage
                .from("submissions")
                .createSignedUrl(sub.audio_path, 3600);

              if (signedData && signedData.signedUrl) {
                audioHtml = `<audio controls src="${signedData.signedUrl}" style="margin: 8px 0; max-width: 100%; height: 36px;"></audio>`;
              } else {
                const errAudioMsg = (window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.couldNotGenerateAudioUrl", { path: sub.audio_path }) : `Could not generate audio URL (${sub.audio_path})`;
                audioHtml = `<p style="color: #ef4444; font-size: 0.8rem;">${escapeHtml(errAudioMsg)}</p>`;
              }
            }

            const badgeColor = sub.status === "reviewed" ? "background: #dcfce7; color: #166534;" : "background: #fee2e2; color: #991b1b;";
            const taskLabel = isAudio ? ((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("submission.audioTask") : "🎙️ Audio Task") : ((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("submission.essayAssignment") : "📝 Essay Assignment");

            html += `
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <span style="font-weight: 600; font-size: 0.85rem; color: #334155;">${taskLabel}</span>
                  <span style="font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; ${badgeColor}">${escapeHtml(sub.status || "submitted")}</span>
                </div>

                ${sub.text_content ? `
                  <div style="background: white; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 0.85rem; color: #334155; white-space: pre-wrap; margin-bottom: 6px;">
                    ${escapeHtml(sub.text_content)}
                  </div>
                ` : ""}

                ${audioHtml}

                <div style="margin-top: 8px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label style="font-size: 0.8rem; font-weight: 600; color: #475569;">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("submission.teacherFeedback") : "Teacher Feedback:"}</label>
                    <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                      <button onclick="insertQuickFeedback('${textareaId}', 'Great pronunciation & clear intonation! 🌟')" style="font-size: 0.7rem; background: #e0f2fe; color: #0369a1; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer;">+ Pronunciation</button>
                      <button onclick="insertQuickFeedback('${textareaId}', 'Excellent use of target vocabulary! 👏')" style="font-size: 0.7rem; background: #f3e8ff; color: #6d28d9; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer;">+ Vocabulary</button>
                      <button onclick="insertQuickFeedback('${textareaId}', 'Well structured response, good grammar! 👍')" style="font-size: 0.7rem; background: #dcfce7; color: #166534; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer;">+ Grammar</button>
                    </div>
                  </div>
                  <textarea id="${textareaId}" style="width: 100%; height: 55px; padding: 6px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; font-family: inherit;">${escapeHtml(sub.feedback || "")}</textarea>
                  <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
                    <button onclick="saveSubmissionReview('${sub.id}', '${textareaId}')" style="background: #0369a1; color: white; border: none; border-radius: 6px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">${(window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.markReviewed") : "Mark reviewed ✔️"}</button>
                  </div>
                </div>
              </div>
            `;
          }

          html += `</div></div>`;
        }

        html += `</div></div>`;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    async function saveSubmissionReview(submissionId, textareaId) {
      const textarea = document.getElementById(textareaId);
      if (!textarea) return;

      const feedback = textarea.value;
      const client = window.CosyAuth ? window.CosyAuth.client : null;

      if (!client) {
        if (window.CosyUI) window.CosyUI.toast((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.offlineCannotSaveReview") : "Offline - cannot save review");
        return;
      }

      try {
        const { data: { session } } = await client.auth.getSession();
        const teacherId = session?.user?.id;

        const { error } = await client
          .from("lesson_submissions")
          .update({
            status: "reviewed",
            feedback: feedback,
            reviewed_by: teacherId,
            reviewed_at: new Date().toISOString()
          })
          .eq("id", submissionId);

        if (error) throw error;

        if (window.CosyUI) window.CosyUI.toast((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.reviewSaved") : "Review saved and status updated!");
        loadTeacherSubmissions();
      } catch (err) {
        console.error("saveSubmissionReview error:", err);
        if (window.CosyUI) window.CosyUI.toast((window.CosyI18n && window.CosyI18n.t) ? window.CosyI18n.t("teacher.failedToSaveReview") : "Failed to save review");
      }
    }

    function insertQuickFeedback(textareaId, phrase) {
      const el = document.getElementById(textareaId);
      if (!el) return;
      if (el.value.trim().length > 0) {
        el.value = el.value.trim() + " " + phrase;
      } else {
        el.value = phrase;
      }
    }

    window.insertQuickFeedback = insertQuickFeedback;
    window.fetchTeacherStudents = fetchTeacherStudents;
    window.loadTeacherSubmissions = loadTeacherSubmissions;
    window.renderGroupedSubmissions = renderGroupedSubmissions;
    window.saveSubmissionReview = saveSubmissionReview;
    window.escapeHtml = escapeHtml;

    /* Web-Based Lesson Creator Modal Implementation */
    async function openLessonCreatorModal() {
      const allowed = window.CosyAuthoring && typeof window.CosyAuthoring.canAuthor === 'function'
        ? await window.CosyAuthoring.canAuthor('teacher')
        : false;

      if (!allowed) {
        const msg = (window.CosyI18n && window.CosyI18n.t)
          ? window.CosyI18n.t('teacher.authoringAccessDenied')
          : 'Only the founder and designated main teachers can create or edit lessons.';
        if (window.CosyUI && window.CosyUI.toast) CosyUI.toast(msg, 'warning');
        else alert(msg);
        return;
      }

      let modal = document.getElementById('lesson-creator-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'lesson-creator-modal';
        modal.style.cssText = `
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          background: rgba(15, 23, 42, 0.75); z-index: 99999; display: flex;
          align-items: center; justify-content: center; padding: 20px;
        `;
        document.body.appendChild(modal);
      }

      modal.innerHTML = `
        <div style="background: white; border-radius: 14px; width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); border: 1px solid #cbd5e1;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px;">
            <h2 style="margin: 0; font-size: 1.35rem; color: #0f172a; display: flex; align-items: center; gap: 8px;">
              <span>✨ Create New Web Lesson</span>
            </h2>
            <button onclick="closeLessonCreatorModal()" style="border: none; background: #f1f5f9; border-radius: 8px; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer;">✖</button>
          </div>

          <form id="lesson-creator-form" onsubmit="handleLessonSubmit(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
              <div>
                <label style="font-weight: 700; font-size: 0.85rem; color: #334155;">Template Type</label>
                <select id="creator-template-type" onchange="switchCreatorTemplatePreset()" style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 4px; font-weight: 600;">
                  <option value="general">📘 General Lesson (Warm-up, Vocab, Grammar, Reading/Listening)</option>
                  <option value="speaking_club">🗣️ Speaking Club Session (Icebreakers, Phrasebank, Discussion Cards)</option>
                </select>
              </div>

              <div>
                <label style="font-weight: 700; font-size: 0.85rem; color: #334155;">Lesson Title</label>
                <input type="text" id="creator-title" required placeholder="e.g. Travel Experiences & Debates" style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 4px;" />
              </div>

              <div>
                <label style="font-weight: 700; font-size: 0.85rem; color: #334155;">Language</label>
                <select id="creator-lang" style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 4px;">
                  <option value="en">🇬🇧 English</option>
                  <option value="fr">🇫🇷 French</option>
                  <option value="ru">🇷🇺 Russian</option>
                </select>
              </div>

              <div>
                <label style="font-weight: 700; font-size: 0.85rem; color: #334155;">CEFR Level</label>
                <select id="creator-level" style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 4px;">
                  <option value="a1">A1 Elementary</option>
                  <option value="a2">A2 Pre-Intermediate</option>
                  <option value="b1" selected>B1 Intermediate</option>
                  <option value="b2">B2 Upper-Intermediate</option>
                  <option value="c1">C1 Advanced</option>
                </select>
              </div>
            </div>

            <div style="margin-bottom: 20px;">
              <label style="font-weight: 700; font-size: 0.85rem; color: #334155;">Lesson Slides & Section Content (JSON or Custom Block Sequence)</label>
              <textarea id="creator-slides-json" rows="8" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: monospace; font-size: 0.82rem; margin-top: 4px;" placeholder="Pre-populated preset structure..."></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
              <button type="button" onclick="closeLessonCreatorModal()" style="padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: 600; cursor: pointer;">Cancel</button>
              <button type="submit" style="padding: 8px 20px; border-radius: 6px; border: none; background: #059669; color: white; font-weight: 700; cursor: pointer;">💾 Save & Publish to Supabase</button>
            </div>
          </form>
        </div>
      `;
      modal.style.display = 'flex';
      switchCreatorTemplatePreset();
    }

    function closeLessonCreatorModal() {
      const modal = document.getElementById('lesson-creator-modal');
      if (modal) modal.style.display = 'none';
    }

    function switchCreatorTemplatePreset() {
      const type = document.getElementById('creator-template-type')?.value;
      const jsonArea = document.getElementById('creator-slides-json');
      if (!jsonArea) return;

      if (type === 'speaking_club') {
        jsonArea.value = JSON.stringify({
          type: "speaking_club",
          slides: [
            {
              id: "sc-slide-1",
              title: "1. Warm-Up & Icebreaker Questions",
              stage: "Icebreaker",
              elements: [
                { type: "instruction", content: "Ask participants to answer 1-2 warm-up questions in 60 seconds each." },
                { type: "blockquote", content: "• What was the highlight of your week?\n• If you could travel anywhere tomorrow, where would you go and why?" }
              ]
            },
            {
              id: "sc-slide-2",
              title: "2. Key Conversational Expressions & Phrasebank",
              stage: "Phrasebank",
              elements: [
                { type: "instruction", content: "Review essential debate and discussion phrases." },
                { type: "blockquote", content: "• 'From my perspective...'\n• 'I see your point, but on the flip side...'\n• 'Could you elaborate on that?'" }
              ]
            },
            {
              id: "sc-slide-3",
              title: "3. Categorized Discussion Cards & Debates",
              stage: "Discussion",
              elements: [
                { type: "instruction", content: "Divide into pairs/breakouts to discuss arguments." },
                { type: "blockquote", content: "Card 1: Is remote work better than working in an office?\nCard 2: How is technology changing modern communication?" }
              ]
            }
          ]
        }, null, 2);
      } else {
        jsonArea.value = JSON.stringify({
          type: "general",
          slides: [
            {
              id: "gen-slide-1",
              title: "1. Lead-In & Topic Introduction",
              stage: "Warm-up",
              elements: [
                { type: "instruction", content: "Introduce the main lesson topic." },
                { type: "blockquote", content: "Discuss: What comes to mind when you hear this topic?" }
              ]
            },
            {
              id: "gen-slide-2",
              title: "2. Target Vocabulary Focus",
              stage: "Vocabulary",
              elements: [
                { type: "instruction", content: "Learn key target vocabulary items." }
              ]
            },
            {
              id: "gen-slide-3",
              title: "3. Grammar & Controlled Practice",
              stage: "Grammar",
              elements: [
                { type: "instruction", content: "Complete the grammar exercise." }
              ]
            }
          ]
        }, null, 2);
      }
    }

    async function handleLessonSubmit(e) {
      e.preventDefault();
      const allowed = window.CosyAuthoring && typeof window.CosyAuthoring.canAuthor === 'function'
        ? await window.CosyAuthoring.canAuthor('teacher')
        : false;

      if (!allowed) {
        const msg = (window.CosyI18n && window.CosyI18n.t)
          ? window.CosyI18n.t('teacher.authoringAccessDenied')
          : 'Only the founder and designated main teachers can create or edit lessons.';
        if (window.CosyUI && window.CosyUI.toast) CosyUI.toast(msg, 'warning');
        else alert(msg);
        return;
      }

      const title = document.getElementById('creator-title')?.value;
      const lang = document.getElementById('creator-lang')?.value;
      const level = document.getElementById('creator-level')?.value;
      const templateType = document.getElementById('creator-template-type')?.value;
      const rawJson = document.getElementById('creator-slides-json')?.value;

      try {
        const slidesObj = JSON.parse(rawJson);
        const slug = `lessons/${lang}/${level}/${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.json`;

        const lessonPayload = {
          lesson_id: slug,
          title: title,
          language: lang,
          level: level,
          template_type: templateType,
          xml_content: JSON.stringify({
            title: title,
            language: lang,
            level: level,
            templateType: templateType,
            slides: slidesObj.slides || []
          })
        };

        if (window.CosyLessons && typeof window.CosyLessons.saveLessonToSupabase === 'function') {
          await window.CosyLessons.saveLessonToSupabase(lessonPayload);
          if (window.CosyUI) window.CosyUI.toast('✅ Lesson created & published to Supabase!', 'success');
          closeLessonCreatorModal();
        } else {
          alert('Lesson published successfully to local storage/state.');
          closeLessonCreatorModal();
        }
      } catch (err) {
        console.error('Error saving lesson:', err);
        const permMsg = (window.CosyI18n && window.CosyI18n.t)
          ? window.CosyI18n.t('teacher.saveLessonPermissionError')
          : 'Permission denied: You do not have authoring rights to save lessons.';

        const isPermissionErr = err && (
          err.code === '42501' ||
          (err.message && (
            err.message.includes('row-level security') ||
            err.message.includes('permission') ||
            err.message.includes('policy') ||
            err.message.includes('violates')
          ))
        );

        const errorToast = isPermissionErr ? permMsg : ('Error saving lesson: ' + (err.message || err));
        if (window.CosyUI && window.CosyUI.toast) {
          CosyUI.toast(errorToast, 'error');
        } else {
          alert(errorToast);
        }
      }
    }

    window.openLessonCreatorModal = openLessonCreatorModal;
    window.closeLessonCreatorModal = closeLessonCreatorModal;
    window.switchCreatorTemplatePreset = switchCreatorTemplatePreset;
    window.handleLessonSubmit = handleLessonSubmit;

    const originalInitTeacherApp = initTeacherApp;
    initTeacherApp = async function() {
      await originalInitTeacherApp();
      loadUserNotes('teacher');
    };

    window.onload = initTeacherApp;
  </script>
</body>
