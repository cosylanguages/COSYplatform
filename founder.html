<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYlanguages — Founder &amp; Executive Portal</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/styles/style.css">
  <style>
    :root {
      --founder-primary: #0f172a;
      --founder-accent: var(--cosy-platform-accent, #0284c7);
      --card-bg: #ffffff;
      --border-color: var(--cosy-color-border, rgba(74, 107, 80, 0.12));
    }

    body {
      background-color: var(--cosy-color-cream, #fdfcf8);
      color: #0f172a;
    }

    .founder-header {
      background: var(--founder-primary);
      color: white;
      padding: 1.5rem 0;
      border-bottom: 1px solid #1e293b;
    }

    .founder-header-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-founder {
      background: #0c4a6e;
      color: #bae6fd;
      padding: 4px 12px;
      border-radius: var(--cosy-radius-full, 100px);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-md, 14px);
      padding: 1.5rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--founder-accent);
    }

    .portal-section {
      background: white;
      border-radius: var(--cosy-radius-md, 14px);
      border: 1px solid var(--border-color);
      padding: 2rem;
      margin-top: 2rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .portal-section h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    .teacher-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .teacher-link-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-sm, 8px);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .teacher-link-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .btn-logout {
      background-color: #334155;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Admin Table Styling */
    .admin-table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    .admin-table th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 2px solid #cbd5e1;
    }

    .admin-table td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    .admin-table select, .admin-table input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      box-sizing: border-box;
    }

    .admin-table input:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-save-row {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-save-row:hover {
      background-color: #0369a1;
    }

    .instructions-card {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #0369a1;
    }

    .instructions-card ol {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    .instructions-card li {
      margin-bottom: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/js/auth-guard.js"></script>
</head>
<body>

  <div style="background: #fffbe3; border-bottom: 1px solid #f59e0b; color: #78350f; text-align: center; padding: 10px 16px; font-size: 0.85rem; font-weight: 600;">
    ℹ️ Notice: COSYlanguages entry points have consolidated into <a id="notice-hub-link" href="hub.html" style="color: #0284c7; text-decoration: underline;">hub.html</a>. Please update your bookmarks.
  </div>

  <header class="founder-header">
    <div class="founder-header-content">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 1.4rem; font-weight: 800;">COSYlanguages</span>
        <span class="badge-founder">Founder &amp; Executive Portal</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div id="user-info" style="font-size: 0.85rem; color: #94a3b8;"></div>

    </div>
  </header>

  <main id="app-root" class="container" style="max-width: 1100px;">
    <!-- Rendered via JS -->
  </main>

  <footer class="cosy-ecosystem-strip-footer">
    🌐 Part of the COSY ecosystem •
    <a href="https://cosylanguages.github.io/COSYlanguages/" target="_blank" rel="noopener">COSYlanguages 🏠</a> •
    <a href="https://cosylanguages.github.io/COSYtools/" target="_blank" rel="noopener">COSYtools 🔎</a> •
    <a href="https://cosylanguages.github.io/COSYgames/" target="_blank" rel="noopener">COSYgames 🎮</a> •
    <a href="https://cosylanguages.github.io/COSYevents/" target="_blank" rel="noopener">COSYevents 🎉</a>
  </footer>

  <script>
    /*
     * NOTE ON ROW LEVEL SECURITY (RLS) UPDATE POLICY:
     * This Founder Admin Panel performs UPDATE operations directly against the 'profiles' table via:
     *   supabaseClient.from('profiles').update({...}).eq('id', rowId)
     *
     * In addition to the existing founder SELECT policy in supabase/schema.sql, executing updates
     * requires a founder-only UPDATE RLS policy on the profiles table:
     *
     * CREATE POLICY "Founders can update all profiles"
     *   ON profiles FOR UPDATE
     *   USING (
     *     EXISTS (
     *       SELECT 1 FROM profiles
     *       WHERE id = auth.uid() AND role = 'founder'
     *     )
     *   );
     */

    async function initFounderApp() {
      const authData = await window.CosyAuth.requireRole(['founder']);
      if (!authData) return;

      const userEmail = authData.user ? authData.user.email : '';
      document.getElementById('user-info').innerText = `Founder: ${userEmail || 'Executive'}`;

      renderFounderDashboard();
      await loadUserProfiles();
    }

          </div>
          <div class="stat-card">
            <h3>Curriculum Index Files</h3>
            <div class="stat-number">112</div>
            <p style="font-size: 0.85rem; color: #10b981; margin-top: 4px;">100% Schema Validated</p>
          </div>
          <div class="stat-card">
            <h3>Interactive Lesson JSONs</h3>
            <div class="stat-number">104</div>
            <p style="font-size: 0.85rem; color: #10b981; margin-top: 4px;">Gabarit 14 Champs Standard</p>
          </div>
        </div>

        <!-- Founder User Management Admin Panel -->
        <div class="portal-section" id="user-management-section">
          <h2>🛡️ User Access &amp; Profiles Admin</h2>

          <div class="instructions-card">
            <strong>➕ How to Create a New User:</strong>
            <ol>
              <li>Create the user account via <strong>Supabase Dashboard → Authentication → Users → Add User</strong> (set email &amp; initial password).</li>
              <li>Once created, return here to assign their role (founder/teacher/student/host), language permissions, course level access, and hosted sessions (for hosts).</li>
            </ol>
          </div>

          <div id="profiles-table-container">
            <p style="color: #64748b; font-style: italic;">Loading user profiles from Supabase...</p>
          </div>
        </div>

        <div class="portal-section">
          <h2>👩‍🏫 Language-Specific Teacher Spaces</h2>
          <p style="color: #64748b; margin-bottom: 1rem;">Select any language card to enter the dedicated teacher space for that language:</p>
          <div class="teacher-links-grid">
            <div class="teacher-link-card">
              <h4>🇬🇧 English Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General, Spoken, Grammar, Phrasal Verbs, Vocab</p>
              <a href="teacher-english.html" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open English Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇫🇷 French Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General, Spoken, Professional, Travelling, Pronunciation</p>
              <a href="teacher-french.html" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open French Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇷🇺 Russian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General, Spoken, Professional, Travelling, Pronunciation</p>

              <a href="teacher.html?lang=de" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open German Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇪🇸 Spanish Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Spanish A1 - C1 Courses</p>
              <a href="teacher.html?lang=es" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Spanish Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇵🇹 Portuguese Space</h4>

              <a href="teacher.html?lang=pt" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Portuguese Space 📚</a>
            </div>

            <div class="teacher-link-card">
              <h4>🇦🇲 Armenian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Armenian A1 - C1 Courses</p>
              <a href="teacher.html?lang=hy" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Armenian Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇬🇪 Georgian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Georgian A1 - C1 Courses</p>
              <a href="teacher.html?lang=ka" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Georgian Space 📚</a>

            </div>
            <div class="teacher-link-card">
              <h4>🎓 Universal Master Teacher Portal</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">Unrestricted access to all languages &amp; raw catalog</p>
              <a href="teacher.html" class="btn btn-outline" style="text-align: center;">Open Master Portal 📚</a>
            </div>
          </div>
        </div>

        <div class="portal-section">
          <h2>🧑‍🎓 Student Workspace Access</h2>
          <div class="teacher-links-grid">
            <div class="teacher-link-card">
              <h4>🧑‍🎓 Student Workspace</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">Preview student view with authenticated session</p>
              <a href="student.html" class="btn btn-secondary" style="text-align: center;">View Student Workspace 📚</a>
            </div>
          </div>
        </div>
      `;
    }

    function toggleHostedSessionsField(userId) {
      const roleSelect = document.getElementById(`role-${userId}`);
      const sessionsInput = document.getElementById(`sessions-${userId}`);
      if (!roleSelect || !sessionsInput) return;

      if (roleSelect.value === 'host') {
        sessionsInput.disabled = false;
        sessionsInput.style.display = 'block';
      } else {
        sessionsInput.disabled = true;
        sessionsInput.style.display = 'none';
      }
    }

    async function loadUserProfiles() {
      const container = document.getElementById('profiles-table-container');
      if (!container) return;

      const client = window.CosyAuth.client;
      if (!client) {
        container.innerHTML = `<p style="color: #ef4444;">Supabase client not initialized. Unable to load profiles.</p>`;
        return;
      }

      try {
        const { data: profiles, error } = await client
          .from('profiles')
          .select('id, role, language_access, course_level, hosted_sessions, created_at')
          .order('created_at', { ascending: false });

        if (error) {
          container.innerHTML = `<p style="color: #ef4444;">Error fetching user profiles: ${error.message}</p>`;
          return;
        }

        if (!profiles || profiles.length === 0) {
          container.innerHTML = `<p style="color: #64748b;">No user profiles found in the system.</p>`;
          return;
        }

        let html = `
          <div class="admin-table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Role</th>
                  <th>Language Access</th>
                  <th>Course Levels</th>
                  <th>Hosted Sessions</th>
                  <th>Created At</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
        `;

        profiles.forEach(p => {
          const langsStr = Array.isArray(p.language_access) ? p.language_access.join(', ') : (p.language_access || '*');
          const sessionsStr = Array.isArray(p.hosted_sessions) ? p.hosted_sessions.join(', ') : (p.hosted_sessions || '');
          const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString() : 'N/A';
          const isHost = p.role === 'host';

          html += `
            <tr id="profile-row-${p.id}">
              <td style="font-family: monospace; font-size: 0.8rem; color: #64748b;" title="${p.id}">
                ${p.id.substring(0, 8)}...
              </td>
              <td style="width: 120px;">
                <select id="role-${p.id}" onchange="toggleHostedSessionsField('${p.id}')">
                  <option value="student" ${p.role==='student'?'selected':''}>student</option>
                  <option value="teacher" ${p.role==='teacher'?'selected':''}>teacher</option>
                  <option value="host" ${p.role==='host'?'selected':''}>host</option>
                  <option value="founder" ${p.role==='founder'?'selected':''}>founder</option>
                </select>
              </td>
              <td style="width: 160px;">
                <input type="text" id="langs-${p.id}" value="${langsStr.replace(/"/g, '&quot;')}" placeholder="e.g. en, fr or *" />
              </td>
              <td style="width: 140px;">
                <input type="text" id="levels-${p.id}" value="${(p.course_level || '*').replace(/"/g, '&quot;')}" placeholder="e.g. a1, c1 or *" />
              </td>
              <td style="width: 180px;">
                <input type="text" id="sessions-${p.id}" value="${sessionsStr.replace(/"/g, '&quot;')}" placeholder="e.g. session-01, session-02" ${isHost ? '' : 'disabled style="display:none;"'} />
              </td>
              <td style="font-size: 0.8rem; color: #64748b;">
                ${dateStr}
              </td>
              <td>
                <button onclick="saveUserProfile('${p.id}')" id="btn-save-${p.id}" class="btn-save-row">Save</button>
                <span id="status-${p.id}" style="font-size: 0.8rem; margin-left: 8px;"></span>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table></div>`;
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">System error loading profiles: ${err.message}</p>`;
      }
    }

    async function saveUserProfile(userId) {
      const client = window.CosyAuth.client;
      const statusEl = document.getElementById(`status-${userId}`);
      const btnEl = document.getElementById(`btn-save-${userId}`);

      if (!client) {
        if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444;">Client offline</span>`;
        return;
      }

      const role = document.getElementById(`role-${userId}`).value;
      const rawLangs = document.getElementById(`langs-${userId}`).value.trim();
      const course_level = document.getElementById(`levels-${userId}`).value.trim();
      const rawSessions = document.getElementById(`sessions-${userId}`).value.trim();

      // Parse comma-separated language_access array
      let language_access = [];
      if (rawLangs === '*' || !rawLangs) {
        language_access = ['*'];
      } else {
        language_access = rawLangs.split(',').map(s => s.trim()).filter(Boolean);
      }

      // Parse comma-separated hosted_sessions array when role is host
      let hosted_sessions = [];
      if (role === 'host' && rawSessions) {
        hosted_sessions = rawSessions.split(',').map(s => s.trim()).filter(Boolean);
      }

      if (btnEl) btnEl.disabled = true;
      if (statusEl) statusEl.innerHTML = `<span style="color: #0284c7;">Saving...</span>`;

      try {
        const updatePayload = {
          role: role,
          language_access: language_access,
          course_level: course_level,
          updated_at: new Date().toISOString()
        };

        if (role === 'host') {
          updatePayload.hosted_sessions = hosted_sessions;
        }

        const { error } = await client
          .from('profiles')
          .update(updatePayload)
          .eq('id', userId);

        if (error) {
          if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444;">Error: ${error.message}</span>`;
        } else {
          if (statusEl) statusEl.innerHTML = `<span style="color: #10b981; font-weight: 600;">Saved ✔️</span>`;
          setTimeout(() => { if (statusEl) statusEl.innerHTML = ''; }, 3000);
        }
      } catch (err) {
        if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444;">${err.message}</span>`;
      } finally {
        if (btnEl) btnEl.disabled = false;
      }
    }

    window.onload = initFounderApp;
  </script>
</body>
</html>
