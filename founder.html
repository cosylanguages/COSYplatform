<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYlanguages — Founder &amp; Executive Portal</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/styles/style.css">
  <style>
    :root {
      --founder-primary: #0f172a;
      --founder-accent: var(--cosy-platform-accent, #0284c7);
      --card-bg: #ffffff;
      --border-color: var(--cosy-color-border, rgba(74, 107, 80, 0.12));
    }

    body {
      background-color: var(--cosy-color-cream, #fdfcf8);
      color: #0f172a;
    }

    .founder-header {
      background: var(--founder-primary);
      color: white;
      padding: 1.5rem 0;
      border-bottom: 1px solid #1e293b;
    }

    .founder-header-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-founder {
      background: #0c4a6e;
      color: #bae6fd;
      padding: 4px 12px;
      border-radius: var(--cosy-radius-full, 100px);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-md, 14px);
      padding: 1.5rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--founder-accent);
    }

    .portal-section {
      background: white;
      border-radius: var(--cosy-radius-md, 14px);
      border: 1px solid var(--border-color);
      padding: 2rem;
      margin-top: 2rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .portal-section h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    .teacher-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .teacher-link-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-sm, 8px);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .teacher-link-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .access-denied {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border-radius: var(--cosy-radius-md, 14px);
      border: 1px solid #cbd5e1;
      text-align: center;
      box-shadow: var(--cosy-shadow-sm);
    }
  </style>
  <script src="shared/js/access-grants.js"></script>
</head>
<body>

  <div style="background: #fffbe3; border-bottom: 1px solid #f59e0b; color: #78350f; text-align: center; padding: 10px 16px; font-size: 0.85rem; font-weight: 600;">
    ℹ️ Notice: COSYlanguages entry points have consolidated into <a id="notice-hub-link" href="hub.html" style="color: #0284c7; text-decoration: underline;">hub.html</a>. Please update your bookmarks.
  </div>

  <header class="founder-header">
    <div class="founder-header-content">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 1.4rem; font-weight: 800;">COSYlanguages</span>
        <span class="badge-founder">Founder &amp; Executive Portal</span>
      </div>
      <div id="user-info" style="font-size: 0.85rem; color: #94a3b8;"></div>
    </div>
  </header>

  <main id="app-root" class="container" style="max-width: 1100px;">
    <!-- Rendered via JS -->
  </main>

  <footer class="cosy-ecosystem-strip-footer">
    🌐 Part of the COSY ecosystem •
    <a href="https://cosylanguages.github.io/COSYlanguages/" target="_blank" rel="noopener">COSYlanguages 🏠</a> •
    <a href="https://cosylanguages.github.io/COSYtools/" target="_blank" rel="noopener">COSYtools 🔎</a> •
    <a href="https://cosylanguages.github.io/COSYgames/" target="_blank" rel="noopener">COSYgames 🎮</a> •
    <a href="https://cosylanguages.github.io/COSYevents/" target="_blank" rel="noopener">COSYevents 🎉</a>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key');

    async function initFounderApp() {
      const appRoot = document.getElementById('app-root');

      if (!key) {
        renderAccessDenied("Missing Access Key", "An access key is required to view the founder dashboard.");
        return;
      }

      const noticeLink = document.getElementById('notice-hub-link');
      if (noticeLink && key) {
        noticeLink.href = `hub.html?key=${encodeURIComponent(key)}`;
      }

      try {
        const grantsRes = await fetch('data/access-grants.json');
        if (!grantsRes.ok) throw new Error("Unable to load access grants");
        const grantsData = await grantsRes.json();

        const grant = await window.CosyAccessGrants.matchGrant(grantsData.grants, key);
        const fullManifest = window.CosyAccessGrants ? window.CosyAccessGrants.FULL_MANIFEST : [];
        const allowedCourses = window.CosyAccessGrants ? window.CosyAccessGrants.resolveGrantCourses(grant, fullManifest) : [];

        if (!grant || (grant.role !== 'founder' && !allowedCourses.includes('*'))) {
          renderAccessDenied("Founder Access Denied", "This portal requires Founder or Administrator privileges.");
          return;
        }

        document.getElementById('user-info').innerText = `Founder: ${grant.name || 'Founder'}`;
        renderFounderDashboard();

      } catch (err) {
        renderAccessDenied("System Error", err.message);
      }
    }

    function renderAccessDenied(title, message) {
      document.getElementById('app-root').innerHTML = `
        <div class="access-denied">
          <h2>🔒 ${title}</h2>
          <p>${message}</p>
        </div>
      `;
    }

    function renderFounderDashboard() {
      const appRoot = document.getElementById('app-root');

      appRoot.innerHTML = `
        <div class="dashboard-grid">
          <div class="stat-card">
            <h3>Active Language Tracks</h3>
            <div class="stat-number">11</div>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">EN, FR, RU, DE, ES, PT, IT, HY, KA, BA, TT</p>
          </div>
          <div class="stat-card">
            <h3>Curriculum Index Files</h3>
            <div class="stat-number">112</div>
            <p style="font-size: 0.85rem; color: #10b981; margin-top: 4px;">100% Schema Validated</p>
          </div>
          <div class="stat-card">
            <h3>Interactive Lesson JSONs</h3>
            <div class="stat-number">104</div>
            <p style="font-size: 0.85rem; color: #10b981; margin-top: 4px;">Gabarit 14 Champs Standard</p>
          </div>
        </div>

        <div class="portal-section">
          <h2>👩‍🏫 Language-Specific Teacher Spaces</h2>
          <p style="color: #64748b; margin-bottom: 1rem;">Select any language card to enter the dedicated teacher space for that language:</p>
          <div class="teacher-links-grid">
            <div class="teacher-link-card">
              <h4>🇬🇧 English Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General, Spoken, Grammar, Phrasal Verbs, Vocab</p>
              <a href="teacher-english.html?key=${encodeURIComponent(key)}" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open English Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇫🇷 French Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General, Spoken, Professional, Travelling, Pronunciation</p>
              <a href="teacher-french.html?key=${encodeURIComponent(key)}" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open French Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇷🇺 Russian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General, Spoken, Professional, Travelling, Pronunciation</p>
              <a href="teacher-russian.html?key=${encodeURIComponent(key)}" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Russian Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇩🇪 German Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General German A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=de" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open German Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇪🇸 Spanish Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Spanish A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=es" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Spanish Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇵🇹 Portuguese Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Portuguese A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=pt" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Portuguese Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇮🇹 Italian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Italian A1 - C2 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=it" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Italian Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇬🇷 Greek Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General &amp; Exam Greek A1 - C2 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=el" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Greek Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇦🇲 Armenian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Armenian A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=hy" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Armenian Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇬🇪 Georgian Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Georgian A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=ka" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Georgian Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇵🇱 Tatar Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Tatar A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=tt" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Tatar Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇷🇺 Bashkir Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Bashkir A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=ba" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Bashkir Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🇫🇷 Breton Space</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">General Breton A1 - C1 Courses</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}&lang=br" class="btn" style="background: var(--cosy-platform-teacher, #0369a1); text-align: center;">Open Breton Space 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>🎓 Universal Master Teacher Portal</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">Unrestricted access to all languages &amp; raw catalog</p>
              <a href="teacher.html?key=${encodeURIComponent(key)}" class="btn btn-outline" style="text-align: center;">Open Master Portal 📚</a>
            </div>
          </div>
        </div>

        <div class="portal-section">
          <h2>🔑 Access Grants &amp; Student Workbooks</h2>
          <div class="teacher-links-grid">
            <div class="teacher-link-card">
              <h4>🧑‍🎓 Student Workspace</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">Preview student view with current key</p>
              <a href="student.html?key=${encodeURIComponent(key)}" class="btn btn-secondary" style="text-align: center;">View Student Workspace 📚</a>
            </div>
            <div class="teacher-link-card">
              <h4>⚙️ Access Grants Generator</h4>
              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">Generate hashed JSON entries for data/access-grants.json</p>
              <a href="admin-grants.html" class="btn btn-outline" style="text-align: center;">Open Grant Generator ⚙️</a>
            </div>
          </div>
        </div>
      `;
    }

    window.onload = initFounderApp;
  </script>
</body>
</html>
