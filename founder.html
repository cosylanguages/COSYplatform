<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0369a1">

  <style>
    :root {
      --founder-primary: #0f172a;
      --founder-accent: var(--cosy-platform-accent, #0369a1);
      --card-bg: #ffffff;
      --border-color: var(--cosy-color-border, rgba(74, 107, 80, 0.12));
    }

    body {
      background-color: var(--cosy-color-cream, #fdfcf8);
      color: #0f172a;
    }

    .founder-header {
      background: var(--founder-primary);
      color: white;
      padding: 1.5rem 0;
      border-bottom: 1px solid #1e293b;
    }

    .founder-header-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-founder {
      background: #0c4a6e;
      color: #bae6fd;
      padding: 4px 12px;
      border-radius: var(--cosy-radius-full, 100px);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-md, 14px);
      padding: 1.5rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--founder-accent);
    }

    .portal-section {
      background: white;
      border-radius: var(--cosy-radius-md, 14px);
      border: 1px solid var(--border-color);
      padding: 2rem;
      margin-top: 2rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .portal-section h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    .teacher-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .teacher-link-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-sm, 8px);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .teacher-link-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .btn-logout {
      background-color: #334155;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Admin Table Styling */
    .admin-table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    .admin-table th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 2px solid #cbd5e1;
    }

    .admin-table td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    .admin-table select, .admin-table input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      box-sizing: border-box;
    }

    .admin-table select:disabled, .admin-table input:disabled {
      background-color: #f1f5f9;
      color: #475569;
      cursor: not-allowed;
    }

    .btn-save-row {
      background-color: #0369a1;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-save-row:hover {
      background-color: #0369a1;
    }

    .instructions-card {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #0369a1;
    }

    .instructions-card ol {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    .instructions-card li {
      margin-bottom: 4px;
    }
  </style>

  <script>
    /*
     * NOTE ON ROW LEVEL SECURITY (RLS) UPDATE POLICY:
     * This Founder Admin Panel performs UPDATE operations directly against the 'profiles' table via:
     *   supabaseClient.from('profiles').update({...}).eq('id', rowId)
     *
     * In addition to the existing founder SELECT policy in supabase/schema.sql, executing updates
     * requires a founder-only UPDATE RLS policy on the profiles table:
     *
     * CREATE POLICY "Founders can update profiles"
     *   ON profiles FOR UPDATE
     *   USING (public.is_founder())
     *   WITH CHECK (public.is_founder());
     */

    async function initFounderApp() {
      const authData = await window.CosyAuth.requireRole(['founder']);
      if (!authData) return;

      window.currentUserId = authData.user ? authData.user.id : null;
      const userEmail = authData.user ? authData.user.email : '';
      document.getElementById('user-info').innerText = `Founder: ${userEmail || 'Executive'}`;

      await renderFounderDashboard();
      await loadUserProfiles();
    }

        : 'Stats unavailable';

        ? `available of ${stats.courses.total.toLocaleString()} in catalog`
        : 'Stats unavailable';

        ? `available of ${stats.lessons.total.toLocaleString()} planned`

        : '';

            <div class="stat-number">${langBig}</div>

          </div>

            <div class="stat-number">${lessonBig}</div>

            ${lessonSub2 ? `<p style="font-size: 0.85rem; color: #64748b; margin-top: 2px;">${lessonSub2}</p>` : ''}

        </div>

        <!-- Founder User Management Admin Panel -->

          <div class="instructions-card">
            <strong>➕ How to Create a New User:</strong>
            <ol>
              <li>Create the user account via <strong>Supabase Dashboard → Authentication → Users → Add User</strong> (set email &amp; initial password).</li>
              <li>Once created, return here to assign their role (founder, teacher or student), language permissions, course level access, and hosted event sessions (teachers only). New accounts appear in this list automatically as students.</li>
            </ol>
          </div>

          <div id="profiles-table-container">

          </div>
        </div>

        <div class="portal-section">

        <div class="portal-section">

              <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">Preview student view with authenticated session</p>

    }

    function toggleHostedSessionsField(userId) {
      const roleSelect = document.getElementById(`role-${userId}`);
      const sessionsInput = document.getElementById(`sessions-${userId}`);
      if (!roleSelect || !sessionsInput) return;

      if (roleSelect.value === 'teacher') {
        sessionsInput.disabled = false;
        sessionsInput.style.display = 'block';
      } else {
        sessionsInput.disabled = true;
        sessionsInput.style.display = 'none';
      }
    }

    async function loadUserProfiles() {
      const container = document.getElementById('profiles-table-container');
      if (!container) return;

      const client = window.CosyAuth.client;
      if (!client) {
        container.innerHTML = `<p style="color: #ef4444;">Supabase client not initialized. Unable to load profiles.</p>`;
        return;
      }

      try {
        const { data: profiles, error } = await client
          .from('profiles')
          .select('id, role, language_access, course_level, hosted_sessions, created_at')
          .order('created_at', { ascending: false });

        if (error) {
          container.innerHTML = `<p style="color: #ef4444;">Error fetching user profiles: ${error.message}</p>`;
          return;
        }

        if (!profiles || profiles.length === 0) {
          container.innerHTML = `<p style="color: #64748b;">No user profiles found in the system.</p>`;
          return;
        }

        let html = `
          <div class="admin-table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Role</th>
                  <th>Language Access (* = all, empty = none)</th>
                  <th>Course Levels</th>
                  <th>Hosted Sessions</th>
                  <th>Created At</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
        `;

        profiles.forEach(p => {
          const langsStr = Array.isArray(p.language_access) ? p.language_access.join(', ') : (p.language_access || '');
          const sessionsStr = Array.isArray(p.hosted_sessions) ? p.hosted_sessions.join(', ') : (p.hosted_sessions || '');
          const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString() : 'N/A';
          const isTeacher = p.role === 'teacher';
          const isSelf = Boolean(window.currentUserId && p.id === window.currentUserId);

          html += `
            <tr id="profile-row-${p.id}">
              <td style="font-family: monospace; font-size: 0.8rem; color: #64748b;" title="${p.id}">
                ${p.id.substring(0, 8)}...
              </td>
              <td style="width: 120px;">
                <select id="role-${p.id}" ${isSelf ? 'disabled title="You cannot change your own role here"' : ''} onchange="toggleHostedSessionsField('${p.id}')">
                  <option value="student" ${p.role==='student'?'selected':''}>student</option>
                  <option value="teacher" ${p.role==='teacher'?'selected':''}>teacher</option>
                  <option value="founder" ${p.role==='founder'?'selected':''}>founder</option>
                </select>
              </td>
              <td style="width: 160px;">
                <input type="text" id="langs-${p.id}" value="${langsStr.replace(/"/g, '&quot;')}" placeholder="e.g. en, fr or *" />
              </td>
              <td style="width: 140px;">
                <input type="text" id="levels-${p.id}" value="${(p.course_level || '*').replace(/"/g, '&quot;')}" placeholder="e.g. a1, c1 or *" />
              </td>
              <td style="width: 180px;">
                <input type="text" id="sessions-${p.id}" value="${sessionsStr.replace(/"/g, '&quot;')}" placeholder="e.g. session-01, session-02" ${isTeacher ? '' : 'disabled style="display:none;"'} />
              </td>
              <td style="font-size: 0.8rem; color: #64748b;">
                ${dateStr}
              </td>
              <td>
                <button onclick="saveUserProfile('${p.id}')" id="btn-save-${p.id}" class="btn-save-row">Save</button>
                <span id="status-${p.id}" style="font-size: 0.8rem; margin-left: 8px;"></span>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table></div>`;
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">System error loading profiles: ${err.message}</p>`;
      }
    }

    async function saveUserProfile(userId) {
      const client = window.CosyAuth.client;
      const statusEl = document.getElementById(`status-${userId}`);
      const btnEl = document.getElementById(`btn-save-${userId}`);

      if (!client) {
        if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444;">Client offline</span>`;
        return;
      }

      const roleSelectEl = document.getElementById(`role-${userId}`);
      const role = roleSelectEl ? roleSelectEl.value : 'student';
      const rawLangs = document.getElementById(`langs-${userId}`).value.trim();
      const course_level = document.getElementById(`levels-${userId}`).value.trim();
      const rawSessions = document.getElementById(`sessions-${userId}`).value.trim();

      // Parse comma-separated language_access array
      let language_access = [];
      if (rawLangs === '*') {
        language_access = ['*'];
      } else if (rawLangs) {
        language_access = rawLangs.split(',').map(s => s.trim()).filter(Boolean);
      }

      // Parse comma-separated hosted_sessions array when role is teacher
      let hosted_sessions = [];
      if (role === 'teacher' && rawSessions) {
        hosted_sessions = rawSessions.split(',').map(s => s.trim()).filter(Boolean);
      }

      if (btnEl) btnEl.disabled = true;
      if (statusEl) statusEl.innerHTML = `<span style="color: #0369a1;">Saving...</span>`;

      try {
        const updatePayload = {
          role: role,
          language_access: language_access,
          course_level: course_level,
          hosted_sessions: hosted_sessions,
          updated_at: new Date().toISOString()
        };

        const { data, error } = await client
          .from('profiles')
          .update(updatePayload)
          .eq('id', userId)
          .select('id');

        if (error || !data || data.length !== 1) {
          if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">Not saved. You may not have permission to change this profile.</span>`;
        } else {
          if (statusEl) statusEl.innerHTML = `<span style="color: #047857; font-weight: 600;">Saved ✔️</span>`;
          setTimeout(() => { if (statusEl) statusEl.innerHTML = ''; }, 3000);
        }
      } catch (err) {
        if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">Not saved. You may not have permission to change this profile.</span>`;
      } finally {
        if (btnEl) btnEl.disabled = false;
      }
    }

    window.onload = initFounderApp;
